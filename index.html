<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131010">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ГОПНИК — современная мобильная версия v0.2</title>
  <style>
    :root{font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace;color:#e5e5dc;background:#0d0f11;font-size:15px;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0,#1d261d,#0d0f11 55%);}
    button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    #app{max-width:760px;margin:auto;min-height:100dvh;padding:12px 12px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
    .heading{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .brand{font-size:clamp(23px,7vw,39px);font-weight:900;letter-spacing:4px;color:#63e28c;text-shadow:0 0 16px #2fa65d48}
    .edition{font-size:10px;color:#8b988e;text-align:right;line-height:1.6;letter-spacing:1px}
    .divider{height:1px;background:linear-gradient(90deg,#37a45f,#3f473e,transparent)}
    .panel{background:#101511;border:1px solid #334a37;border-radius:12px;overflow:hidden}
    .panel-title{color:#63e28c;font-size:11px;text-transform:uppercase;letter-spacing:1.3px;padding:11px 12px 8px}
    .panel-body{padding:12px}
    .notice{color:#e9cb67;line-height:1.6}.muted{color:#a7b2aa}.red{color:#fa8181}.green{color:#83e68e}.yellow{color:#edd576}.blue{color:#83b9ff}
    .stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px}
    .stat{background:#192019;border:1px solid #283a2c;border-radius:8px;padding:9px 6px;text-align:center;min-width:0}
    .stat b{display:block;color:#f4efcd;font-size:15px;font-variant-numeric:tabular-nums}.stat small{display:block;color:#94a49a;font-size:10px;margin-top:4px;white-space:nowrap}
    .hp-track{height:6px;background:#382023;margin:1px 9px 9px;border-radius:10px;overflow:hidden}.hp-bar{height:100%;background:linear-gradient(90deg,#ee6969,#f6c277);transition:width .15s}
    .hero-sub{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:11px;color:#b5c3b5;padding:8px 11px 0}
    .scene-title{color:#f0d66f;font-weight:800;margin-bottom:7px;letter-spacing:.5px}.story{font-size:14px;line-height:1.65;margin:0 0 8px;white-space:pre-line}
    .log{max-height:min(30dvh,280px);overflow:auto;overscroll-behavior:contain;scrollbar-color:#45664c transparent;padding:12px 13px;background:#070a08;border-top:1px solid #263b2b;font-size:13px;line-height:1.55}
    .log-line{padding:4px 0;border-bottom:1px dashed #1f2922;white-space:pre-line;overflow-wrap:break-word}.log-line:last-child{border:0}.log .combat{color:#fb9292}.log .loot{color:#e9da74}.log .good{color:#90e89b}.log .info{color:#b1bebe}
    .action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}
    .action{background:#19241c;color:#eaf8e8;border:1px solid #47654b;border-radius:10px;padding:13px 8px;min-height:51px;text-align:center;font-size:13px;font-weight:700;line-height:1.3;box-shadow:inset 0 1px 0 #ffffff09}
    .action:active{background:#315c37;transform:translateY(1px)}.action:disabled{opacity:.42;cursor:not-allowed}.action.warn{background:#33231e;border-color:#866147}.action.primary{background:#235132;border-color:#64b16e}.action.wide{grid-column:1/-1}
    .tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:#0a0f0bea;padding:7px 4px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);border:1px solid #344a38;border-radius:12px;z-index:8;margin-top:auto}
    .tab{padding:10px 1px;border:0;border-radius:7px;background:none;color:#9caf9f;font-size:11px;line-height:1.5;min-height:52px}
    .tab.active{background:#22482e;color:#8cffad}.tab-ico{display:block;font-size:19px}
    .start{display:flex;flex-direction:column;gap:12px;max-width:620px;width:100%;margin:1vh auto auto}.intro-logo{font-size:clamp(35px,12vw,72px);color:#65e287;letter-spacing:6px;text-align:center;font-weight:900;text-shadow:0 0 24px #65e2873a;margin:10px 0 0}
    .version{text-align:center;color:#88998a;font-size:11px}.classes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
    .class{border:1px solid #49644a;background:#161d17;border-radius:12px;text-align:left;color:#e5ece5;padding:13px;min-height:98px}.class.selected{background:#21492b;border:2px solid #76d78b;padding:12px}.class strong{color:#b6ffaf;display:block;font-size:15px;margin-bottom:8px}.class small{color:#a9b6ab;line-height:1.5}
    .name{width:100%;border:1px solid #547253;border-radius:10px;background:#111b12;color:white;padding:15px;outline:none}.name:focus{border-color:#7ff39e}
    .score{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:#d0dccd;padding:6px 0}.score span{color:#b7efb9}
    .smallbtn{border:1px solid #476c50;background:#18241b;color:#b4eabc;border-radius:8px;padding:8px 10px;font-size:11px}
    .footer{font-size:10px;color:#687a6c;text-align:center;padding:4px 0}.enemy{border:1px solid #813e3e;background:#291719;border-radius:9px;margin:10px;padding:12px}.enemy b{color:#ffaaaa}.enemy .hp-track{margin:8px 0 0}
    .badge{display:inline-block;color:#eecb6e;border:1px solid #5c5436;border-radius:50px;padding:4px 7px;font-size:10px}.text-list{font-size:12px;line-height:1.8;margin:8px 0}
    @media (max-width:360px){#app{padding:8px 7px}.action{padding:10px 5px;font-size:12px}.stat{padding:9px 4px}.stat b{font-size:13px}.tab{font-size:10px}}
    @media (min-width:640px){.stats-grid{grid-template-columns:repeat(6,1fr)}.log{max-height:320px}}
  
/* v0.2 — illustrated mobile edition (game rules and save key retained) */
:root {font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#eee9e0;background:#09090b;font-size:15px;color-scheme:dark}
body {background:radial-gradient(ellipse at 50% -120px,#37302a 0%,#191717 38%,#090a0b 76%);}
#app{max-width:580px;padding:12px 12px max(18px,env(safe-area-inset-bottom));gap:11px}
.brand{font-family:Impact,'Arial Narrow',sans-serif;color:#f4f0e9;font-size:clamp(28px,7.2vw,41px);letter-spacing:1px;font-style:italic;text-shadow:2px 2px 0 #972f23,4px 5px 0 #240d0a;transform:rotate(-2deg)}
.edition{color:#dcbd7e;font-size:10px;line-height:1.45;font-weight:800}
.heading{padding:5px 3px 8px}.divider{background:linear-gradient(90deg,#ba7335,#ecc576,transparent);height:2px}
.panel{background:linear-gradient(155deg,#242321,#141515 80%);border:1px solid #655345;border-radius:15px;box-shadow:0 6px 20px #0006}
.panel-title{color:#d7b577;font-size:11px;font-weight:900;letter-spacing:1.35px;padding:12px 14px 8px}
.panel-body{padding:12px 14px}
.hero-sub{padding:12px 4px 2px;color:#dbd7d0;font-size:12px;gap:10px}
.hero-sub strong{color:#f6edd5}.hero-sub .badge{background:#30261e;border:1px solid #90633e;color:#f6c88c;font-weight:700}
.stats-grid{gap:6px;padding:9px;grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{background:#151616;border:1px solid #433e36;border-radius:9px;padding:10px 3px}
.stat b{color:#f8f1e3;font-size:16px}.stat small{color:#b7b0a5;font-size:10px}
.hp-track{background:#352323;height:7px;margin:0 10px 11px}.hp-bar{background:linear-gradient(90deg,#bb4138,#ff9063);box-shadow:0 0 8px #dc5544aa}
.xp-track{height:5px;background:#353126;overflow:hidden;border-radius:6px;margin:0 10px 12px}
.xp-fill{height:100%;background:linear-gradient(90deg,#c08b39,#ffd479)}
.story{font-size:14px;line-height:1.62;margin:0 0 7px;color:#e3ded6}
.scene-title{color:#f8d48e;font-size:16px;font-weight:900;margin:3px 0 9px;letter-spacing:.3px}
.scene-visual{display:flex;align-items:end;position:relative;height:clamp(182px,51vw,260px);border-radius:13px 13px 0 0;overflow:hidden;background-color:#262426;background-size:cover;background-position:center center;border-bottom:1px solid #756246}
.scene-visual:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#090b0c12 10%,#0b0d0d22 40%,#080707e8 100%);pointer-events:none}
.scene-info{position:relative;z-index:1;padding:13px 15px;width:100%}
.scene-kicker{font-size:10px;text-transform:uppercase;color:#e6be74;letter-spacing:1.8px;font-weight:900;display:block;padding-bottom:5px}
.scene-headline{font-family:Impact,'Arial Narrow',sans-serif;color:#fff2dc;font-size:clamp(24px,7.2vw,35px);letter-spacing:.7px;line-height:1.07;text-shadow:0 2px 8px #000}
.scene-number{position:absolute;right:14px;top:13px;z-index:1;font-size:10px;font-weight:900;background:#090b0bab;color:#e9d2af;border:1px solid #c29e6799;padding:6px 9px;border-radius:30px}

.action-grid{gap:9px;padding:10px 13px 13px}
.action{background:linear-gradient(#383331,#242423);color:#fbf3e5;border:1px solid #796452;border-radius:10px;padding:13px 9px;min-height:57px;text-align:center;font-family:system-ui,-apple-system,sans-serif;font-size:13px;font-weight:800;letter-spacing:.1px;box-shadow:inset 0 1px 0 #ffffff17,0 2px 2px #0005}
.action.primary{background:linear-gradient(#edbd63,#bf7b2e);color:#23170c;border:1px solid #ffd58c;box-shadow:inset 0 1px 0 #fff6,0 3px 6px #0008}
.action.warn{background:linear-gradient(#523b3b,#322527);border-color:#976056}
.action:active{background:#755b3b;transform:scale(.985)}.action:disabled{opacity:.37}
.tabs{bottom:0;background:#0d0e10f2;border:1px solid #705944;border-radius:14px;box-shadow:0 -8px 26px #0009;padding:7px 4px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(15px)}
.tab{font-family:system-ui,sans-serif;color:#bbb2a7;font-size:10px;font-weight:750;min-height:54px;border-radius:9px}
.tab.active{background:linear-gradient(#64492a,#382b20);color:#fce0a4;box-shadow:inset 0 0 0 1px #ab7c3e}
.tab-ico{font-size:21px;margin-bottom:2px}
.log{background:#101112;max-height:210px;border-top:1px solid #343231;color:#d9d5cb;font-size:13px}
.log-line{border-bottom:1px dashed #393532}.log .combat{color:#ffa5a0}.log .loot{color:#f3d18a}.log .good{color:#8be8a6}.log .info{color:#b9bebd}
.enemy{background:linear-gradient(#472528,#2b181b);border:1px solid #aa5556;border-radius:10px;color:#f1dcdc}
.enemy b{color:#ffc2a7}
.battle-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid #ef806c;border-radius:6px;background:#461c1cc9;padding:6px 10px;margin-top:9px;color:#ffd8c3;font-size:12px;font-weight:900;letter-spacing:.6px}

.start-cover-inner{padding:17px 16px 16px;position:relative;z-index:2}.start-cover .intro-logo{font-family:Impact,'Arial Narrow',sans-serif;font-style:italic;font-size:clamp(51px,15vw,90px);text-align:left;line-height:1;color:#fff6df;text-shadow:2px 3px 0 #b43b25,5px 6px 0 #1b0d0d;margin:0;letter-spacing:0px;transform:rotate(-3deg)}

<body><div id="app" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='gopnik-mobile-prototype-v1';
const REGION=['Университет','Шлюз','ОбьГЭС','Ельцовка','Кабинет ректора'];
const CLASSES=[
 {id:'pac',name:'Пацан',desc:'Ровный характер. Всё понемногу.',s:2,a:2,v:2,l:2,rep:2},
 {id:'frost',name:'Отморозок',desc:'Сильный, но не особо удачливый.',s:4,a:1,v:3,l:0,rep:0},
 {id:'gop',name:'Гопник',desc:'Уличный авторитет и сбалансированная сила.',s:3,a:2,v:2,l:1,rep:5},
 {id:'thief',name:'Вор',desc:'Ловкость, удача и больше случайных находок.',s:1,a:4,v:1,l:4,rep:0}
];
const PRICE={hotdog:6,beer:12,shoes:35,shirt:45,knuckle:45,heal:18,force:20,vital:20,agility:22,luck:22,armor:30};
const $=sel=>document.querySelector(sel),app=$('#app');
function safeRead(){try{let s=JSON.parse(localStorage.getItem(KEY));return s&&s.version===1?s:null;}catch{return null}}
function safeWrite(){try{localStorage.setItem(KEY,JSON.stringify(game))}catch{}}
function rng(lo,hi){return Math.floor(Math.random()*(hi-lo+1))+lo}
function clamp(n,min,max){return Math.min(max,Math.max(min,n))}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function initial(){return {version:1,screen:'select',name:'',classId:'gop',player:null,region:0,view:'street',log:[],fight:null,winCounts:[0,0,0,0,0],unlocked:{gym:false,trader:false},turns:0}}
let game=safeRead()||initial();
function note(text,type='info'){game.log.push({text,type});if(game.log.length>70)game.log.shift()}
function saveRender(){safeWrite();render()}
function needXp(p){return 12+p.level*12}
function maxHp(p){return 10+p.v*5+p.s}
function chance(p){return clamp(62+p.a*5,65,94)}
function newGame(){const cfg=CLASSES.find(c=>c.id===game.classId)||CLASSES[2];const nick=($('#nick')?.value||'').trim().slice(0,22)||'Безымянный';game={...initial(),screen:'game',name:nick,classId:cfg.id,player:{s:cfg.s,a:cfg.a,v:cfg.v,l:cfg.l,rep:cfg.rep,level:1,exp:0,points:0,hp:10+cfg.v*5+cfg.s,money:18,beer:0,hotdog:0,weapon:0,armor:0,shoes:0,wins:0},view:'street'};note('Тебя выставили из университета. Начинаешь с нуля: впереди улицы, знакомства и путь к ректору.','loot');note('Ты — '+cfg.name.toLowerCase()+'. Выбери, куда направиться.','good');saveRender()}
function heal(p,n){p.hp=Math.min(maxHp(p),p.hp+n)}
function level(p){while(p.exp>=needXp(p)){p.exp-=needXp(p);p.level++;p.points++;p.hp=maxHp(p);note('НОВЫЙ УРОВЕНЬ! +1 очко прокачки. Открой «Герой».','good')}}
function addExp(n){game.player.exp+=n;level(game.player)}
function hurt(amount){const p=game.player;let dealt=Math.max(1,amount-p.armor);p.hp=Math.max(0,p.hp-dealt);note(`Тебе прилетело −${dealt} здоровья.`, 'combat');if(p.hp<=0){game.screen='dead';game.fight=null;note('Ты проиграл эту схватку.','combat')}}
function spawn(boss=false){const p=game.player,d=game.region;const lvl=boss?Math.max(8,p.level+2):Math.max(1,p.level+rng(-1,1)+Math.floor(d/2));const types=['Дворовый задира','Наглый пацан','Отморозок','Местный авторитет','Беспредельщик'];const e={name:boss?'Ректор':types[rng(0,types.length-1)],level:lvl,hp:boss?75:8+lvl*3+d*3,attack:boss?10:1+lvl+Math.floor(d/2),def:boss?2:Math.floor(lvl/3),boss};e.maxHp=e.hp;game.fight=e;game.view='street';note(`На тебя наехал ${e.name.toLowerCase()} (${e.level} ур.).`, 'combat');}
function enemyTurn(){if(!game.fight)return;const p=game.player,e=game.fight;if(Math.random() < Math.min(.30,p.a*.025)){note('Ты увернулся от удара.','good');return}hurt(rng(1,e.attack))}
function attack(){if(!game.fight)return;const p=game.player,e=game.fight;if(rng(1,100)>chance(p)){note('Ты промахнулся.','combat');enemyTurn();return saveRender()}
 const damage=Math.max(1,rng(Math.max(1,Math.floor(p.s/2)),Math.max(2,p.s+2))+p.weapon+p.shoes-e.def);e.hp-=damage;note(`Ты нанёс ${damage} урона.`, 'good');if(e.hp<=0){const prize=e.boss?80:rng(3,14)+game.region*4,experience=e.boss?100:10+e.level*4;game.fight=null;p.money+=prize;p.rep+=e.boss?35:2;p.wins++;game.winCounts[game.region]++;note(`Победа! +${prize} ₽, +${experience} опыта, +${e.boss?35:2} авторитета.`, 'loot');addExp(experience);if(e.boss){game.screen='won';note('Ты доказал ректору, что тебя рано списали со счетов.','good')}else if(canMove()){note('Новый район открыт! Нажми «В следующий район».','loot')}}else{enemyTurn()}saveRender()}
function flee(){if(!game.fight)return;if(rng(1,100)<=42+game.player.a*7){note('Удалось убежать от драки.','good');game.fight=null}else{note('Убежать не получилось.','combat');enemyTurn()}saveRender()}
function canMove(){return game.region<4 && game.winCounts[game.region]>=[4,5,6,6][game.region]}
function travel(){if(!canMove())return;game.region++;game.view='street';game.fight=null;game.unlocked={gym:false,trader:false};note('Новый район: '+REGION[game.region]+'.','loot');if(game.region===4)note('Последняя цель — ректор. Подготовься и начни финальную схватку.','combat');else note('Здесь соперники сильнее. Осмотрись и прокачай героя.','info');saveRender()}
function wander(){if(game.fight)return;if(game.region===4){spawn(true);return saveRender()}game.turns++;let r=rng(1,100);if(r<=12){let coins=rng(3,8)+game.player.l;game.player.money+=coins;note(`Нашёл на дороге ${coins} ₽.`,'loot')}else if(r<=30){note('Обошёл пару дворов. Пока тихо.','info')}else{spawn(false)}saveRender()}
function discuss(){if(game.fight)return;const p=game.player;p.rep+=2;game.unlocked.gym=true;game.unlocked.trader=true;note('Поговорил с местными. Теперь знаешь, где качалка и барыги. +2 авторитета.','good');saveRender()}
function buy(kind){if(game.fight)return;const p=game.player;const prices={...PRICE};if(!prices[kind])return;
 if(p.money<prices[kind]){note('Не хватает денег.','combat');return saveRender()}
 if(kind==='shoes'&&p.shoes>=2 ||kind==='shirt'&&p.armor>=2 ||kind==='knuckle'&&p.weapon>=2){note('Такое у тебя уже есть.','info');return saveRender()}
 p.money-=prices[kind];const opts={hotdog:()=>{p.hotdog++;note('Купил хот-дог.','loot')},beer:()=>{p.beer++;note('Купил бутылку пива.','loot')},shoes:()=>{p.shoes=2;note('Новые бутсы: +2 к урону.','good')},shirt:()=>{p.armor+=2;note('Кожанка: +2 к защите.','good')},knuckle:()=>{p.weapon=2;note('Кастет: +2 к урону.','good')},heal:()=>{p.hp=maxHp(p);note('Ветеринар тебя подлатал.','good')},force:()=>{p.s++;p.hp+=1;note('Качалка: сила +1.','good')},vital:()=>{p.v++;p.hp+=5;note('Качалка: живучесть +1.','good')},agility:()=>{p.a++;note('Тренировка: ловкость +1.','good')},luck:()=>{p.l++;note('Тренировка: удача +1.','good')},armor:()=>{p.armor++;note('Тренировка: защита +1.','good')}};opts[kind]();saveRender()}
function use(item){const p=game.player;if(game.fight){note('Во время боя это не получится.','combat');return saveRender()}if(item==='beer'&&p.beer>0){p.beer--;heal(p,10);note('Выпил пиво. Здоровье восстановилось.','good')}else if(item==='hotdog'&&p.hotdog>0){p.hotdog--;heal(p,6);note('Перекусил. +6 здоровья.','good')}else{note('Этого нет в инвентаре.','combat')}saveRender()}
function treat(){if(game.player.hp===maxHp(game.player)){note('Ты и так полностью здоров.','info');saveRender();return}buy('heal')}
function pub(){const p=game.player;if(p.beer<1){note('Чтобы угостить пацанов, сначала купи пиво на рынке.','combat');return saveRender()}p.beer--;p.rep+=5;note('Угостил пацанов: авторитет +5.','good');saveRender()}
function upgrade(stat){const p=game.player;if(!p.points || !['s','a','v','l'].includes(stat))return;p.points--;p[stat]++;if(stat==='s')p.hp++;if(stat==='v')p.hp+=5;note(`Прокачка: ${({s:'сила',a:'ловкость',v:'живучесть',l:'удача'})[stat]} +1.`, 'good');saveRender()}
function setView(v){if(game.fight&&v!=='street'){note('Сначала закончи драку!','combat');saveRender();return}game.view=v;saveRender()}
function button(label,action,cls='',disabled=false){return `<button class="action ${cls}" data-action="${esc(action)}" ${disabled?'disabled':''}>${label}</button>`}
function renderStart(){const classIcons={pac:'🧢',frost:'🥊',gop:'🔥',thief:'🎯'};app.innerHTML=`<main class="start"><div class="start-cover"><div class="start-cover-inner"><div class="intro-logo">ГОПНИК</div><div class="version">УЛИЧНАЯ RPG · НОВАЯ ГРАФИКА · v0.2</div></div></div><div class="panel"><div class="panel-body"><p class="start-intro"><b class="yellow">Из университета — на улицы.</b> Начинаешь с нуля. Зарабатывай деньги, набирай авторитет, исследуй районы и решай, кем станешь.</p><label for="nick" class="start-label">Твоё погоняло</label><input id="nick" class="name" maxlength="22" autocomplete="nickname" placeholder="Как тебя зовут на районе?" value="${esc(game.name||'')}"><div class="start-label">Выбери персонажа</div><div class="classes">${CLASSES.map(c=>`<button class="class ${c.id===game.classId?'selected':''}" data-class="${c.id}"><span class="class-ico">${classIcons[c.id]}</span><strong>${esc(c.name)}</strong><small>${esc(c.desc)}</small></button>`).join('')}</div><div class="action-grid" style="padding:0">${button('НАЧАТЬ ИГРУ →','new','primary wide')}</div></div></div><div class="footer">Прогресс сохраняется автоматически. Это новая адаптация классической игры, а не оригинальный DOS-файл.</div></main>`}
function renderHeader(){let p=game.player;return `<header><div class="heading"><div class="brand">ГОПНИК</div><div class="edition">РЕМЕЙК · v0.2<br>ТВОЙ ПУТЬ НАВЕРХ</div></div><div class="divider"></div><div class="hero-sub"><span><strong>${esc(game.name)}</strong> · ${esc(CLASSES.find(c=>c.id===game.classId).name)} · ${p.level} ур.</span><span class="badge">📍 ${esc(REGION[game.region])}</span></div></header><section class="panel"><div class="stats-grid"><div class="stat"><b>${p.hp}/${maxHp(p)}</b><small>❤️ ЗДОРОВЬЕ</small></div><div class="stat"><b>${p.money} ₽</b><small>💵 ДЕНЬГИ</small></div><div class="stat"><b>${p.level}</b><small>⭐ УРОВЕНЬ</small></div><div class="stat"><b>${p.exp}/${needXp(p)}</b><small>⚡ ОПЫТ</small></div><div class="stat"><b>${p.rep}</b><small>🤝 АВТОРИТЕТ</small></div><div class="stat"><b>${p.wins}</b><small>🥊 ПОБЕДЫ</small></div></div><div class="hp-track"><div class="hp-bar" style="width:${p.hp/maxHp(p)*100}%"></div></div><div class="xp-track"><div class="xp-fill" style="width:${p.exp/needXp(p)*100}%"></div></div></section>`}
function contentForView(){let p=game.player,v=game.view,title='',body='',actions='';
 if(v==='street'){
 title=game.region===4?'РЕКТОР — ПОСЛЕДНЯЯ ГЛАВА':`РАЙОН: ${REGION[game.region].toUpperCase()}`;
 body=game.fight?'Тут уже не до прогулок. Соперник ждёт твоего решения.':game.region===4?'Ты добрался до кабинета ректора. Впереди главный противник.':`Ты на улице. Победи ещё ${Math.max(0,[4,5,6,6][game.region]-game.winCounts[game.region])} соперников, чтобы перейти дальше.`;
 if(game.fight){let e=game.fight;body+=`<div class="enemy"><b>${esc(e.name)} · ${e.level} ур.</b><div>Здоровье: ${Math.max(0,e.hp)}/${e.maxHp}</div><div class="hp-track"><div class="hp-bar" style="width:${Math.max(0,e.hp)/e.maxHp*100}%"></div></div></div>`;actions+=button('👊 УДАРИТЬ','attack','primary')+button('🏃 УБЕЖАТЬ','flee','warn')}
 else{actions+=button(game.region===4?'⚔️ ФИНАЛЬНАЯ СХВАТКА':'🚶 ИСКАТЬ ПРИКЛЮЧЕНИЯ','wander','primary wide');if(canMove())actions+=button('➡️ В СЛЕДУЮЩИЙ РАЙОН','travel','wide primary');actions+=button('🤝 ПОГОВОРИТЬ С МЕСТНЫМИ','discuss','wide')}
 }else if(v==='market'){
 title='БАЗАР';body='Здесь можно купить еды, обновить прикид и раздобыть полезные вещи.';
 actions+=button(`🌭 Хот-дог · ${PRICE.hotdog} ₽`,'buy:hotdog')+button(`🍺 Пиво · ${PRICE.beer} ₽`,'buy:beer')+button(`👟 Бутсы +2 · ${PRICE.shoes} ₽`,'buy:shoes')+button(`🧥 Кожанка +2 · ${PRICE.shirt} ₽`,'buy:shirt')+button(`✊ Кастет +2 · ${PRICE.knuckle} ₽`,'buy:knuckle');
 }else if(v==='gym'){
 title='КАЧАЛКА';body=game.unlocked.gym?'Тренируй навыки за деньги. Сила добавляет урон, живучесть — здоровье, ловкость — точность.':'Местные ещё не подсказали тебе дорогу. Сначала поговори с ними на улице.';
 if(game.unlocked.gym)actions+=button(`💪 Сила +1 · ${PRICE.force} ₽`,'buy:force')+button(`❤️ Живучесть +1 · ${PRICE.vital} ₽`,'buy:vital')+button(`⚡ Ловкость +1 · ${PRICE.agility} ₽`,'buy:agility')+button(`🍀 Удача +1 · ${PRICE.luck} ₽`,'buy:luck')+button(`🛡️ Защита +1 · ${PRICE.armor} ₽`,'buy:armor');
 }else if(v==='hangout'){
 title='ПРИТОН / ВЕТЕРИНАР';body='Местные обсуждают дела. Рядом есть доктор, который лечит ушибы за деньги.';
 actions+=button('🤝 Узнать новости','discuss')+button('🍺 Угостить пацанов','pub')+button(`🩺 Вылечиться · ${PRICE.heal} ₽`,'treat','wide');
 }else if(v==='hero'){
 title='ТВОЙ ГЕРОЙ';body=`<div class="score"><div>Сила: <span>${p.s}</span></div><div>Ловкость: <span>${p.a}</span></div><div>Живучесть: <span>${p.v}</span></div><div>Удача: <span>${p.l}</span></div><div>Броня: <span>${p.armor}</span></div><div>Оружие: <span>+${p.weapon+p.shoes}</span></div><div>Пиво: <span>${p.beer}</span></div><div>Хот-доги: <span>${p.hotdog}</span></div></div><div class="yellow">Свободные очки: ${p.points}</div>`;
 actions+=button(`🍺 Выпить пиво (${p.beer})`,'use:beer','',p.beer<1)+button(`🌭 Поесть (${p.hotdog})`,'use:hotdog','',p.hotdog<1);
 if(p.points){actions+=button('Сила +1','up:s')+button('Ловкость +1','up:a')+button('Живучесть +1','up:v')+button('Удача +1','up:l')}
 actions+=button('💾 СОХРАНИТЬ','save')+button('↻ НОВАЯ ИГРА','reset','warn');
 }
 const labels={street:game.region===4?'ФИНАЛЬНАЯ ГЛАВА':'УЛИЦЫ ГОРОДА',market:'ТОРГОВЫЕ РЯДЫ',gym:'ТРЕНИРОВКИ',hangout:'МЕСТНЫЕ ДЕЛА',hero:'ПЕРСОНАЖ'};
 const headline=v==='street'?(game.fight?'РАЗБОРКА':REGION[game.region]):({market:'Базар',gym:'Качалка',hangout:'Притон',hero:'Твой герой'})[v];
 const art=v==='street'?'street':v;
 const fightBadge=game.fight&&v==='street'?'<div class="battle-badge">⚔️ БОЙ НАЧАЛСЯ</div>':'';
 return `<section class="panel"><div class="scene-visual art-${art}"><span class="scene-number">${game.region===4?'ФИНАЛ':'РАЙОН '+(game.region+1)}</span><div class="scene-info"><span class="scene-kicker">${labels[v]}</span><div class="scene-headline">${esc(headline)}</div>${fightBadge}</div></div><div class="panel-body"><div class="scene-title">${title}</div><div class="story">${body}</div></div><div class="action-grid">${actions}</div></section>`;
}
function renderGame(){const logs=game.log.slice(-15).map(l=>`<div class="log-line ${esc(l.type)}">${esc(l.text)}</div>`).join('');const labels=[['street','🚶','Улица'],['market','🛒','Базар'],['gym','💪','Качалка'],['hangout','🏠','Притон'],['hero','👤','Герой']];app.innerHTML=`${renderHeader()}<main>${contentForView()}<section class="panel" style="margin-top:10px"><div class="panel-title">ИСТОРИЯ СОБЫТИЙ · ${game.log.length}</div><div class="log" role="log">${logs}</div></section></main><nav class="tabs" aria-label="Разделы игры">${labels.map(([id,ico,label])=>`<button class="tab ${game.view===id?'active':''}" data-view="${id}" ${game.fight&&id!=='street'?'disabled':''}><span class="tab-ico">${ico}</span>${label}</button>`).join('')}</nav><div class="footer">Прогресс автоматически сохраняется в браузере</div>`}
function renderEnd(){let won=game.screen==='won';app.innerHTML=`${renderHeader()}<main class="panel"><div class="scene-visual art-street"><div class="scene-info"><span class="scene-kicker">${won?'ГЛАВА ПРОЙДЕНА':'УЛИЧНАЯ ИСТОРИЯ'}</span><div class="scene-headline">${won?'ТЫ НА ВЕРШИНЕ':'КОНЕЦ ИГРЫ'}</div></div></div><div class="panel-body"><div class="intro-logo" style="font-size:32px">${won?'ПОБЕДА!':'ТЫ СДОХ'}</div><p class="story" style="text-align:center">${won?'Ты прошёл все районы и победил ректора. Это конец первой тестовой кампании.':'Уличная жизнь оказалась непростой. Начни заново — теперь ты знаешь местные порядки.'}</p><p class="story yellow" style="text-align:center">Побед: ${game.player.wins} · Уровень: ${game.player.level}</p><div class="action-grid">${button('↻ НАЧАТЬ ЗАНОВО','reset','primary wide')}</div></div></main>`}
function render(){if(game.screen==='select')renderStart();else if(game.screen==='game')renderGame();else renderEnd()}
app.addEventListener('click',ev=>{const el=ev.target.closest('button');if(!el||el.disabled)return;
 if(el.dataset.class){game.classId=el.dataset.class;game.name=$('#nick')?.value||game.name;saveRender();return}
 if(el.dataset.view){setView(el.dataset.view);return}
 const action=el.dataset.action;if(!action)return;
 switch(action){case 'new':newGame();return;case 'wander':wander();return;case 'attack':attack();return;case 'flee':flee();return;case 'travel':travel();return;case 'discuss':discuss();return;case 'pub':pub();return;case 'treat':treat();return;case 'save':note('Прогресс сохранён в браузере.','good');saveRender();return;case 'reset':if(confirm('Начать новую игру? Текущий прогресс будет удалён.')){game=initial();saveRender()}return;default:if(action.startsWith('buy:'))buy(action.slice(4));else if(action.startsWith('use:'))use(action.slice(4));else if(action.startsWith('up:'))upgrade(action.slice(3));}
});
window.addEventListener('pagehide',safeWrite);render();
})();
</script>
</body></html>
