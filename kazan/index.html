<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131010">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Гопник — Казань 1998 · сюжетная версия v0.10</title>
  <style>
    :root{font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace;color:#e5e5dc;background:#0d0f11;font-size:15px;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0,#1d261d,#0d0f11 55%);}
    button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    #app{max-width:760px;margin:auto;min-height:100dvh;padding:12px 12px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
    .heading{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .brand{font-size:clamp(23px,7vw,39px);font-weight:900;letter-spacing:4px;color:#63e28c;text-shadow:0 0 16px #2fa65d48}
    .edition{font-size:10px;color:#8b988e;text-align:right;line-height:1.6;letter-spacing:1px}
    .divider{height:1px;background:linear-gradient(90deg,#37a45f,#3f473e,transparent)}
    .panel{background:#101511;border:1px solid #334a37;border-radius:12px;overflow:hidden}
    .panel-title{color:#63e28c;font-size:11px;text-transform:uppercase;letter-spacing:1.3px;padding:11px 12px 8px}
    .panel-body{padding:12px}
    .notice{color:#e9cb67;line-height:1.6}.muted{color:#a7b2aa}.red{color:#fa8181}.green{color:#83e68e}.yellow{color:#edd576}.blue{color:#83b9ff}
    .stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px}
    .stat{background:#192019;border:1px solid #283a2c;border-radius:8px;padding:9px 6px;text-align:center;min-width:0}
    .stat b{display:block;color:#f4efcd;font-size:15px;font-variant-numeric:tabular-nums}.stat small{display:block;color:#94a49a;font-size:10px;margin-top:4px;white-space:nowrap}
    .hp-track{height:6px;background:#382023;margin:1px 9px 9px;border-radius:10px;overflow:hidden}.hp-bar{height:100%;background:linear-gradient(90deg,#ee6969,#f6c277);transition:width .15s}
    .hero-sub{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:11px;color:#b5c3b5;padding:8px 11px 0}
    .scene-title{color:#f0d66f;font-weight:800;margin-bottom:7px;letter-spacing:.5px}.story{font-size:14px;line-height:1.65;margin:0 0 8px;white-space:pre-line}
    .log{max-height:min(30dvh,280px);overflow:auto;overscroll-behavior:contain;scrollbar-color:#45664c transparent;padding:12px 13px;background:#070a08;border-top:1px solid #263b2b;font-size:13px;line-height:1.55}
    .log-line{padding:4px 0;border-bottom:1px dashed #1f2922;white-space:pre-line;overflow-wrap:break-word}.log-line:last-child{border:0}.log .combat{color:#fb9292}.log .loot{color:#e9da74}.log .good{color:#90e89b}.log .info{color:#b1bebe}
    .action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}
    .action{background:#19241c;color:#eaf8e8;border:1px solid #47654b;border-radius:10px;padding:13px 8px;min-height:51px;text-align:center;font-size:13px;font-weight:700;line-height:1.3;box-shadow:inset 0 1px 0 #ffffff09}
    .action:active{background:#315c37;transform:translateY(1px)}.action:disabled{opacity:.42;cursor:not-allowed}.action.warn{background:#33231e;border-color:#866147}.action.primary{background:#235132;border-color:#64b16e}.action.wide{grid-column:1/-1}
    .tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:#0a0f0bea;padding:7px 4px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);border:1px solid #344a38;border-radius:12px;z-index:8;margin-top:auto}
    .tab{padding:10px 1px;border:0;border-radius:7px;background:none;color:#9caf9f;font-size:11px;line-height:1.5;min-height:52px}
    .tab.active{background:#22482e;color:#8cffad}.tab-ico{display:block;font-size:19px}
    .start{display:flex;flex-direction:column;gap:12px;max-width:620px;width:100%;margin:1vh auto auto}.intro-logo{font-size:clamp(35px,12vw,72px);color:#65e287;letter-spacing:6px;text-align:center;font-weight:900;text-shadow:0 0 24px #65e2873a;margin:10px 0 0}
    .version{text-align:center;color:#88998a;font-size:11px}.classes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
    .class{border:1px solid #49644a;background:#161d17;border-radius:12px;text-align:left;color:#e5ece5;padding:13px;min-height:98px}.class.selected{background:#21492b;border:2px solid #76d78b;padding:12px}.class strong{color:#b6ffaf;display:block;font-size:15px;margin-bottom:8px}.class small{color:#a9b6ab;line-height:1.5}
    .name{width:100%;border:1px solid #547253;border-radius:10px;background:#111b12;color:white;padding:15px;outline:none}.name:focus{border-color:#7ff39e}
    .score{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:#d0dccd;padding:6px 0}.score span{color:#b7efb9}
    .smallbtn{border:1px solid #476c50;background:#18241b;color:#b4eabc;border-radius:8px;padding:8px 10px;font-size:11px}
    .footer{font-size:10px;color:#687a6c;text-align:center;padding:4px 0}.enemy{border:1px solid #813e3e;background:#291719;border-radius:9px;margin:10px;padding:12px}.enemy b{color:#ffaaaa}.enemy .hp-track{margin:8px 0 0}
    .badge{display:inline-block;color:#eecb6e;border:1px solid #5c5436;border-radius:50px;padding:4px 7px;font-size:10px}.text-list{font-size:12px;line-height:1.8;margin:8px 0}
    @media (max-width:360px){#app{padding:8px 7px}.action{padding:10px 5px;font-size:12px}.stat{padding:9px 4px}.stat b{font-size:13px}.tab{font-size:10px}}
    @media (min-width:640px){.stats-grid{grid-template-columns:repeat(6,1fr)}.log{max-height:320px}}
  
/* v0.2 — illustrated mobile edition (game rules and save key retained) */
:root {font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#eee9e0;background:#09090b;font-size:15px;color-scheme:dark}
body {background:radial-gradient(ellipse at 50% -120px,#37302a 0%,#191717 38%,#090a0b 76%);}
#app{max-width:580px;padding:12px 12px max(18px,env(safe-area-inset-bottom));gap:11px}
.brand{font-family:Impact,'Arial Narrow',sans-serif;color:#f4f0e9;font-size:clamp(28px,7.2vw,41px);letter-spacing:1px;font-style:italic;text-shadow:2px 2px 0 #972f23,4px 5px 0 #240d0a;transform:rotate(-2deg)}
.edition{color:#dcbd7e;font-size:10px;line-height:1.45;font-weight:800}
.heading{padding:5px 3px 8px}.divider{background:linear-gradient(90deg,#ba7335,#ecc576,transparent);height:2px}
.panel{background:linear-gradient(155deg,#242321,#141515 80%);border:1px solid #655345;border-radius:15px;box-shadow:0 6px 20px #0006}
.panel-title{color:#d7b577;font-size:11px;font-weight:900;letter-spacing:1.35px;padding:12px 14px 8px}
.panel-body{padding:12px 14px}
.hero-sub{padding:12px 4px 2px;color:#dbd7d0;font-size:12px;gap:10px}
.hero-sub strong{color:#f6edd5}.hero-sub .badge{background:#30261e;border:1px solid #90633e;color:#f6c88c;font-weight:700}
.stats-grid{gap:6px;padding:9px;grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{background:#151616;border:1px solid #433e36;border-radius:9px;padding:10px 3px}
.stat b{color:#f8f1e3;font-size:16px}.stat small{color:#b7b0a5;font-size:10px}
.hp-track{background:#352323;height:7px;margin:0 10px 11px}.hp-bar{background:linear-gradient(90deg,#bb4138,#ff9063);box-shadow:0 0 8px #dc5544aa}
.xp-track{height:5px;background:#353126;overflow:hidden;border-radius:6px;margin:0 10px 12px}
.xp-fill{height:100%;background:linear-gradient(90deg,#c08b39,#ffd479)}
.story{font-size:14px;line-height:1.62;margin:0 0 7px;color:#e3ded6}
.scene-title{color:#f8d48e;font-size:16px;font-weight:900;margin:3px 0 9px;letter-spacing:.3px}
.scene-visual{display:flex;align-items:end;position:relative;height:clamp(182px,51vw,260px);border-radius:13px 13px 0 0;overflow:hidden;background-color:#262426;background-size:cover;background-position:center center;border-bottom:1px solid #756246}
.scene-visual:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#090b0c12 10%,#0b0d0d22 40%,#080707e8 100%);pointer-events:none}
.scene-info{position:relative;z-index:1;padding:13px 15px;width:100%}
.scene-kicker{font-size:10px;text-transform:uppercase;color:#e6be74;letter-spacing:1.8px;font-weight:900;display:block;padding-bottom:5px}
.scene-headline{font-family:Impact,'Arial Narrow',sans-serif;color:#fff2dc;font-size:clamp(24px,7.2vw,35px);letter-spacing:.7px;line-height:1.07;text-shadow:0 2px 8px #000}
.scene-number{position:absolute;right:14px;top:13px;z-index:1;font-size:10px;font-weight:900;background:#090b0bab;color:#e9d2af;border:1px solid #c29e6799;padding:6px 9px;border-radius:30px}

.action-grid{gap:9px;padding:10px 13px 13px}
.action{background:linear-gradient(#383331,#242423);color:#fbf3e5;border:1px solid #796452;border-radius:10px;padding:13px 9px;min-height:57px;text-align:center;font-family:system-ui,-apple-system,sans-serif;font-size:13px;font-weight:800;letter-spacing:.1px;box-shadow:inset 0 1px 0 #ffffff17,0 2px 2px #0005}
.action.primary{background:linear-gradient(#edbd63,#bf7b2e);color:#23170c;border:1px solid #ffd58c;box-shadow:inset 0 1px 0 #fff6,0 3px 6px #0008}
.action.warn{background:linear-gradient(#523b3b,#322527);border-color:#976056}
.action:active{background:#755b3b;transform:scale(.985)}.action:disabled{opacity:.37}
.tabs{bottom:0;background:#0d0e10f2;border:1px solid #705944;border-radius:14px;box-shadow:0 -8px 26px #0009;padding:7px 4px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(15px)}
.tab{font-family:system-ui,sans-serif;color:#bbb2a7;font-size:10px;font-weight:750;min-height:54px;border-radius:9px}
.tab.active{background:linear-gradient(#64492a,#382b20);color:#fce0a4;box-shadow:inset 0 0 0 1px #ab7c3e}
.tab-ico{font-size:21px;margin-bottom:2px}
.log{background:#101112;max-height:210px;border-top:1px solid #343231;color:#d9d5cb;font-size:13px}
.log-line{border-bottom:1px dashed #393532}.log .combat{color:#ffa5a0}.log .loot{color:#f3d18a}.log .good{color:#8be8a6}.log .info{color:#b9bebd}
.enemy{background:linear-gradient(#472528,#2b181b);border:1px solid #aa5556;border-radius:10px;color:#f1dcdc}
.enemy b{color:#ffc2a7}
.battle-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid #ef806c;border-radius:6px;background:#461c1cc9;padding:6px 10px;margin-top:9px;color:#ffd8c3;font-size:12px;font-weight:900;letter-spacing:.6px}

<style id="mobile-fullscreen-v04">
html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0}
#app{
 height:100dvh;min-height:0;max-height:100dvh;overflow:hidden;
 padding:max(5px,env(safe-area-inset-top)) 7px max(5px,env(safe-area-inset-bottom));
 gap:5px;display:flex;flex-direction:column
}
#app>header{flex:0 0 auto;min-height:0}
.heading{padding:1px 3px 2px;min-height:32px}
.brand{font-size:clamp(23px,6vw,32px)}
.edition{font-size:9px;line-height:1.1}
.divider{height:1px}
.hero-sub{padding:3px 3px 2px;font-size:11px;white-space:nowrap;overflow:hidden;flex-wrap:nowrap}
.hero-sub>span:first-child{overflow:hidden;text-overflow:ellipsis}
.hero-sub>.badge{overflow:hidden;text-overflow:ellipsis;max-width:46%;white-space:nowrap;padding:3px 5px}
#app>section.panel{flex:0 0 auto}
.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr));padding:3px;gap:3px}
.stats-grid .stat{padding:4px 2px;border-radius:6px}
.stats-grid .stat:nth-child(4),.stats-grid .stat:nth-child(6){display:none}
.stat b{font-size:13px}
.stat small{font-size:9px;letter-spacing:-.3px;margin-top:1px}
.hp-track{margin:0 5px 4px;height:4px}
.xp-track{display:none}
.game-main{display:flex;flex:1 1 auto;min-height:0;flex-direction:column;gap:4px;overflow:hidden}
.scene-panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.scene-visual{height:clamp(92px,21dvh,175px);min-height:0;flex:0 1 auto}
.scene-info{padding:8px 10px}
.scene-kicker{font-size:9px;padding-bottom:2px}
.scene-headline{font-size:clamp(20px,5.5vw,28px)}
.scene-number{right:7px;top:7px;font-size:9px;padding:3px 6px}
.scene-panel>.panel-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:7px 10px}
.scene-title{font-size:13px;margin:0 0 5px}
.story{font-size:clamp(12px,3.25vw,14px);line-height:1.4;margin-bottom:2px}
.chapter-tag{font-size:11px;margin:0 0 3px}
.chapter-place{font-size:11px;margin-bottom:6px}
.scene-panel>.action-grid{flex:0 0 auto;max-height:min(34dvh,215px);overflow-y:auto;overscroll-behavior:contain;gap:5px;padding:6px}
.action{min-height:43px;padding:7px 6px;font-size:clamp(11px,3vw,13px);line-height:1.2}
.enemy{padding:7px;margin:6px 0;font-size:12px}
.event-ticker{border:1px solid #5c4a39;background:#171716;color:#d9c8a7;border-radius:7px;
 display:flex;align-items:center;gap:7px;font:11px system-ui,sans-serif;
 flex:0 0 29px;min-height:29px;width:100%;text-align:left;padding:0 8px}
.event-ticker span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-ticker b{color:#eec88a;font-size:14px}
.tabs{position:relative;flex:0 0 auto;bottom:auto;padding:3px;gap:3px;border-radius:10px;margin:0}
.tab{min-height:45px;padding:3px 0;font-size:10px;line-height:1.15}
.tab-ico{font-size:17px;margin-bottom:0}
#app>.footer{display:none}
.log-overlay{position:fixed;inset:0;background:#000b;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.log-dialog{width:min(580px,100%);height:min(70dvh,530px);border:1px solid #ad8556;background:#111214;
 border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.log-header{display:flex;flex:0 0 44px;justify-content:space-between;align-items:center;color:#f3d28d;
 font-weight:800;font-size:12px;padding:6px 12px}
.log-dialog .log{flex:1;min-height:0;max-height:none;overflow-y:auto}
.start{height:100%;flex:1;min-height:0;overflow:hidden;gap:5px;margin:0 auto}
.start-cover{height:clamp(100px,22dvh,175px);flex:0 1 auto;min-height:80px}
.start-cover-inner{padding:8px 10px}
.start-cover .intro-logo{font-size:clamp(36px,10vw,56px)}
.start-cover .version{font-size:9px;margin-top:2px}
.start>.panel{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.start>.panel .panel-body{padding:8px 10px}
.start-intro{font-size:12px;line-height:1.35;margin:0 0 5px}
.start-label{font-size:10px;margin:7px 0 4px}
.name{padding:8px 10px;min-height:38px;font-size:16px}
.classes{gap:5px;margin:5px 0 8px}
.class,.class.selected{min-height:68px;padding:6px 8px}
.class .class-ico{font-size:17px}
.class strong{font-size:13px;margin:1px 0 2px}
.class small{font-size:10px;line-height:1.2;display:block}
.start .action{min-height:42px}
.start>.footer{display:none}
#app>main.panel{flex:1;min-height:0;overflow-y:auto}
@media (max-height:680px){
 .scene-visual{height:clamp(82px,17dvh,124px)}
 .heading{min-height:27px}
 .hero-sub{padding:2px 3px}
 .scene-panel>.action-grid{max-height:35dvh}
 .start-cover{height:17dvh}
}
@media (max-height:580px){
 .scene-visual{height:70px}
 .scene-info{padding:4px 8px}
 .scene-headline{font-size:19px}
 .hero-sub>.badge{display:none}
 .scene-panel>.action-grid{max-height:38dvh}
 .start-cover{height:100px}
}
</style>

<style id="in-scene-events-v05">
.scene-panel>.panel-body{
 flex:0 1 auto;max-height:49%;min-height:0;
 overflow-y:auto;overflow-x:hidden;
}
.scene-events{
 display:flex;flex-direction:column;
 flex:1 1 auto;min-height:0;
 margin:4px 7px 0;
 border:1px solid #66533e;border-radius:9px;
 background:linear-gradient(165deg,#141413,#0c0d0e 85%);
 overflow:hidden;
}
.scene-events-heading{
 flex:0 0 auto;padding:7px 10px;
 color:#e9bf7a;border-bottom:1px solid #4a3f33;
 font-size:11px;font-weight:850;letter-spacing:.55px;
 display:flex;justify-content:space-between;
}
.scene-events-heading span{color:#b6ab97}
.scene-events-list{
 flex:1 1 auto;min-height:0;
 overflow-y:auto;overscroll-behavior:contain;
 padding:5px 9px 8px;
 scrollbar-color:#7b5b3d #141313;
 -webkit-overflow-scrolling:touch;
 font-size:12px;line-height:1.4;
}
.scene-events-list .log-line{padding:5px 0;border-bottom:1px solid #312c2a}
.scene-events-list .log-line:last-child{border:0}
.scene-events-list .log-line.combat{color:#ffa5a0}
.scene-events-list .log-line.loot{color:#f3d18a}
.scene-events-list .log-line.good{color:#8be8a6}
.scene-events-list .log-line.info{color:#cbc1b6}
@media(max-height:590px){
 .scene-events-heading{padding:5px 8px;font-size:10px}
 .scene-events-list{font-size:11px;padding:3px 7px}
 .scene-panel>.panel-body{max-height:46%}
}
.scene-panel>.panel-body.battle-body{flex:0 0 auto;max-height:none;overflow:visible;}
</style>

<style id="journal-fixed-layout-v06">
/* Keep the illustrated hero scene independent of log length. */
.scene-panel { --scene-hero-height: clamp(92px, 21dvh, 175px); }
.scene-panel > .scene-visual {
  height:var(--scene-hero-height);
  min-height:var(--scene-hero-height);
  max-height:var(--scene-hero-height);
  flex:0 0 var(--scene-hero-height);
}
.scene-panel > .scene-events {
  flex:1 1 0px;
  min-height:0;
  max-height:none;
  overflow:hidden;
  contain:layout;
}
.scene-panel .scene-events-list {
  flex:1 1 0px;
  min-height:0;
  height:0;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  overflow-anchor:none;
}
.scene-panel > .panel-body.battle-body {
  flex:0 0 auto;
  max-height:min(32dvh,210px);
  min-height:0;

<script>
(()=>{'use strict';
const KEY='gopnik-kazan-1998-v03';
 const REGION=['Учебный квартал','Портовые дворы','Речной посёлок','Северная окраина','Старый учебный корпус'];
 const REQUIRED_WINS=[8,12,18,24];

 const REQUIRED_REP=[18,35,60,90];
 const CHAPTERS=[
  {title:'ГЛАВА 1 · САМОЕ ДНО',place:'Городской институт · Казань, 1998',text:'Тебя только что отчислили. Начальник учебного корпуса унизил тебя при всех. Ответить нечем: на улице тебя никто не знает. Начни с обычных дворов — набирайся сил, ищи знакомых и докажи, что ты чего-то стоишь.',choices:[
   {text:'🚶 Выйти на улицу и начать всё с нуля',xp:3,rep:1,reply:'Ты вышел за ворота. Впереди много районов и нелёгкий путь наверх.'},
   {text:'🧢 Сначала осмотреться у корпуса',xp:5,reply:'Пока ты никто, но это можно изменить. Ищи события на улице.'}]},
  {title:'ГЛАВА 2 · ЧУЖОЙ ДВОР',place:'Портовые дворы · вымышленный район',text:'За несколько остановок от знакомого двора жизнь другая: новые компании и гораздо более крепкие противники. На этот раз прошлые заслуги ничего не значат. Заработай уважение здесь.',choices:[
   {text:'🤝 Узнать местные правила',xp:6,rep:2,reply:'Ты узнал, где собираются местные. Теперь можно искать новые знакомства.'},
   {text:'🥊 Проверить себя на незнакомой улице',xp:8,reply:'Ты готов к серьёзным встречам. Дальше всё решат твои навыки.'}]},
  {title:'ГЛАВА 3 · РЕЧНОЙ ПОСЁЛОК',place:'Речной посёлок · вымышленный район',text:'На новой территории часто встречаются опасные противники, но здесь же можно найти редкие вещи и подработки. Без удачи, снаряжения и знакомых продвинуться будет трудно.',choices:[
   {text:'🛒 Осмотреть местный базар',xp:9,reply:'Торговцы знают много интересного. Можно заработать и купить снаряжение.'},
   {text:'🏋️ Спросить о тренировках',xp:7,rep:3,reply:'Ты услышал про небольшую качалку. Самое время поднимать характеристики.'}]},
  {title:'ГЛАВА 4 · КРУТЫЕ РАЙОНЫ',place:'Северная окраина · вымышленный район',text:'Сюда приезжают самые уверенные в себе. Мелких задир почти не осталось, а каждая победа даётся труднее. Подготовься к возвращению туда, откуда тебя выгнали.',choices:[
   {text:'💪 Тренироваться и искать сильных соперников',xp:12,reply:'Теперь важно не только побеждать, но и уметь выжить.'},
   {text:'🤝 Заручиться поддержкой местных',rep:4,xp:5,reply:'Полезные знакомства помогут, когда дело дойдёт до финала.'}]},
  {title:'ФИНАЛ · ВОЗВРАЩЕНИЕ',place:'Старый учебный корпус · учебный корпус',text:'Ты снова стоишь у корпуса. Когда-то тебя выставили отсюда как никого. Теперь на твоей стороне опыт и репутация. За закрытой дверью ждёт тот, с кого всё началось.',choices:[
   {text:'🥊 Войти и бросить вызов начальнику',boss:true,reply:'Тебя ждёт последняя проверка. Теперь назад дороги нет.'}]}
 ];
 const CLASSES=[
  {id:'pac',name:'Пацан',desc:'Сразу есть подруга и открыт клуб.',s:3,a:3,v:3,l:3,rep:2},
  {id:'frost',name:'Отморозок',desc:'Сам восстанавливает здоровье после прогулок.',s:5,a:2,v:4,l:1,rep:0},
  {id:'gop',name:'Гопник',desc:'Знаком с братвой, сразу доступен притон.',s:4,a:3,v:3,l:2,rep:6},
  {id:'thief',name:'Вор',desc:'Везуч в карманных делах; знает барыг.',s:2,a:4,v:2,l:4,rep:0}
 ];
const PRICE={hotdog:6,beer:12,shoes:35,boots:68,shirt:45,vest:110,knuckle:45,knife:95,airgun:165,pellets:16,bandage:15,phone:60,heal:18,force:20,vital:20,agility:22,luck:22,armor:30};
const MISSIONS=[{id:'wins',name:'Показать характер',goal:2,description:'Выиграй два уличных боя после получения задания.',money:45,rep:4},{id:'junk',name:'Дело для своих',goal:3,description:'Принеси три найденные вещи.',money:55,rep:5},{id:'rep',name:'Слово района',goal:5,description:'Заработай 5 авторитета после получения задания.',money:40,rep:3}];
const $=sel=>document.querySelector(sel),app=$('#app');
function safeRead(){try{let s=JSON.parse(localStorage.getItem(KEY));return s&&s.version===1?s:null;}catch{return null}}
function safeWrite(){try{localStorage.setItem(KEY,JSON.stringify(game))}catch{}}
function rng(lo,hi){return Math.floor(Math.random()*(hi-lo+1))+lo}
function clamp(n,min,max){return Math.min(max,Math.max(min,n))}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}

function initial(){return {version:1,screen:'select',name:'',classId:'gop',player:null,region:0,view:'street',log:[],fight:null,winCounts:[0,0,0,0,0],unlocked:{gym:false,trader:false,club:false,hangout:false},turns:0,storyDone:[false,false,false,false,false],storyChoices:[],ending:null,wanted:0,crew:0,rescueUses:0,injuries:{leg:false,jaw:false},junk:0,girlfriend:false,bossPhase:0,discussed:false,crewMission:null,completedMissions:0,rareSeen:[],romance:{met:false,trust:0,tries:0}}}
let game=safeRead()||initial();
function normalizeGame(){
 const def=initial();
 game={...def,...game,unlocked:{...def.unlocked,...(game.unlocked||{})},injuries:{...def.injuries,...(game.injuries||{})}};
 game.rareSeen=Array.isArray(game.rareSeen)?game.rareSeen:[];
 game.romance={met:false,trust:0,tries:0,...(game.romance||{})};
 if(game.girlfriend){game.romance.met=true;game.romance.trust=Math.max(4,game.romance.trust)}
 game.completedMissions=Math.max(0,Number(game.completedMissions)||0);
 game.crewMission=game.crewMission&&MISSIONS.some(x=>x.id===game.crewMission.id)?game.crewMission:null;
 game.winCounts=Array.from({length:5},(_,i)=>game.winCounts?.[i]||0);
 game.storyDone=Array.from({length:5},(_,i)=>!!game.storyDone?.[i]);
 if(game.player){
   const p=game.player;
   p.points??=0;p.junk??=0;p.phone??=false;p.girlfriend??=game.classId==='pac';
   p.bandage??=0;p.ammo??=0;p.airgun??=false;p.charm??=false;
   p.shoes=Math.max(0,Number(p.shoes)||0);p.weapon=Math.max(0,Number(p.weapon)||0);p.armor=Math.max(0,Number(p.armor)||0);
   p.ammo=Math.max(0,Math.floor(p.ammo));p.bandage=Math.max(0,Math.floor(p.bandage));
   game.crew??=game.classId==='gop'?3:0;
   if(game.classId==='pac'){game.girlfriend=true;game.romance.met=true;game.romance.trust=Math.max(4,game.romance.trust)}
   if(game.classId==='gop'){game.crew=Math.max(3,game.crew);game.unlocked.hangout=true}
   if(game.classId==='thief')game.unlocked.trader=true;
   if(game.classId==='pac')game.unlocked.club=true;
 }
}
normalizeGame();safeWrite();
function note(text,type='info'){game.log.push({text,type});if(game.log.length>70)game.log.shift()}
function saveRender(){safeWrite();render()}
function needXp(p){return 12+p.level*12}
function maxHp(p){return 10+p.v*5+p.s}
function chance(p,enemyLevel=p.level){return clamp(66+p.a*4+(p.level-enemyLevel)*5,60,97)}
function newGame(){
 const cfg=CLASSES.find(c=>c.id===game.classId)||CLASSES[2];
 const nick=($('#nick')?.value||'').trim().slice(0,22)||'Безымянный';
 game={...initial(),screen:'game',name:nick,classId:cfg.id,
 player:{s:cfg.s,a:cfg.a,v:cfg.v,l:cfg.l,rep:cfg.rep,level:1,exp:0,points:0,hp:10+cfg.v*5+cfg.s,money:18,beer:0,hotdog:0,weapon:0,armor:0,shoes:0,wins:0,junk:0,phone:false,bandage:0,ammo:0,airgun:false,charm:false},
 girlfriend:cfg.id==='pac',romance:{met:cfg.id==='pac',trust:cfg.id==='pac'?4:0,tries:0},crew:cfg.id==='gop'?3:0};
 if(cfg.id==='pac')game.unlocked.club=true;
 if(cfg.id==='gop')game.unlocked.hangout=true;
 if(cfg.id==='thief')game.unlocked.trader=true;
 note('Казань, 1998 год. Тебя выгнали из института и публично унизили. Теперь ты начинаешь с самого низа.','loot');
 note('Специализация: '+cfg.name+'. '+cfg.desc,'good');
 saveRender();
}

function missionProgress(m){
 const p=game.player;
 if(!m)return 0;
 if(m.id==='wins')return Math.max(0,p.wins-m.baseline);
 if(m.id==='junk')return Math.max(0,p.junk);
 if(m.id==='rep')return Math.max(0,p.rep-m.baseline);
 return 0;
}
function missionInfo(){
 if(!game.crewMission)return 'Поручение пока не взято.';
 const m=game.crewMission,def=MISSIONS.find(x=>x.id===m.id);
 return def.name+': '+Math.min(def.goal,missionProgress(m))+'/'+def.goal+'. '+def.description;
}
function acceptMission(){
 if(game.fight||!game.unlocked.hangout)return;
 if(game.crewMission){note('Сначала закончи текущее поручение.','info');return saveRender()}
 const def=MISSIONS[game.completedMissions%MISSIONS.length];
 game.crewMission={id:def.id,baseline:def.id==='wins'?game.player.wins:def.id==='rep'?game.player.rep:0};
 note('Братва дала поручение: '+def.name+'. '+def.description,'loot');
 saveRender();
}
function claimMission(){
 if(game.fight||!game.unlocked.hangout||!game.crewMission)return;
 const m=game.crewMission,def=MISSIONS.find(x=>x.id===m.id);
 if(missionProgress(m)<def.goal){note('Поручение ещё не выполнено.','info');return saveRender()}
 if(m.id==='junk')game.player.junk-=def.goal;
 game.player.money+=def.money;
 game.player.rep+=def.rep;
 game.crew=Math.min(10,game.crew+1);
 game.completedMissions++;
 game.crewMission=null;
 note('Поручение выполнено! +'+def.money+' ₽, +'+def.rep+' авторитета, +1 доверия братвы.','good');
 saveRender();
}
function rareEvent(){
 const p=game.player;
 const choices=[
  {id:'coach',text:'В заброшенном зале встретился старый тренер. Он показал тебе приём. +12 опыта.',apply:()=>addExp(12)},
  {id:'tram',text:'На последнем трамвае нашлась сумка со старыми вещами. +2 хлама.',apply:()=>{p.junk+=2}},
  {id:'charm',text:'У старьёвщика нашёлся необычный медальон. Удача +2 навсегда.',apply:()=>{p.charm=true;p.l+=2}},
  {id:'wallet',text:'Помог пожилому прохожему донести сумки и получил 35 ₽.',apply:()=>{p.money+=35}}
 ];
 const available=choices.filter(x=>!game.rareSeen.includes(x.id));
 if(!available.length){p.money+=rng(3,9);note('Старые знакомые угостили тебя — осталось немного сдачи.','loot');return}
 const pick=available[rng(0,available.length-1)];
 game.rareSeen.push(pick.id);
 pick.apply();
 note('⭐ Редкое событие: '+pick.text,'loot');
}

function heal(p,n){p.hp=Math.min(maxHp(p),p.hp+n)}
function level(p){
 while(p.exp>=needXp(p)){
  p.exp-=needXp(p);p.level++;
  const weights=[p.s,p.a,p.v,p.l],total=weights.reduce((a,b)=>a+b,0);
  let roll=rng(1,total),selected=0;
  for(let i=0;i<4;i++){roll-=weights[i];if(roll<=0){selected=i;break}}
  const stat=['s','a','v','l'][selected];
  p[stat]++;p.hp=maxHp(p);
  note('НОВЫЙ УРОВЕНЬ '+p.level+'! '+({s:'Сила',a:'Ловкость',v:'Живучесть',l:'Удача'})[stat]+' +1.','good');
 }
}
function addExp(n){game.player.exp+=n;level(game.player)}
function hurt(amount){
 const p=game.player;
 const dealt=Math.max(1,amount-(p.armor||0));
 p.hp=Math.max(0,p.hp-dealt);
 note('Тебе прилетело −'+dealt+' здоровья.','combat');
 if(p.hp<=0){
  if(game.crew>=3 && (p.phone||game.classId==='gop') && game.rescueUses<2){
   game.rescueUses++;
   game.fight=null;
   p.hp=Math.max(5,Math.floor(maxHp(p)*.45));
   game.wanted=0;
   note('Пацаны успели отвезти тебя к знакомому медику. Ты выжил!','good');
  }else{
   game.screen='dead';game.fight=null;
   note('Сил не осталось. История закончилась.','combat');
  }
 }
}
function spawn(boss=false){
 const p=game.player,d=game.region;
 const lvl=boss?Math.max(6,p.level+1):Math.max(1,p.level+rng(-1,1)+Math.floor(d/2));
 const types=['Дворовый задира','Наглый пацан','Отморозок','Местный авторитет','Беспредельщик','Милиционер'];
 const name=boss?(game.bossPhase===0?'Заместитель начальника':'Начальник учебного корпуса'):types[rng(0,types.length-1)];
 const hp=boss?(game.bossPhase===0?38:58):9+lvl*3+d*4;
 game.fight={name,level:lvl,hp,maxHp:hp,attack:boss?7+game.bossPhase*2:1+lvl+Math.floor(d/2),def:boss?2:Math.floor(lvl/3),boss};
 game.view='street';note('Противник: '+name+' ('+lvl+' ур.).','combat');
}
function enemyTurn(){
 if(!game.fight)return;
 const p=game.player,e=game.fight;
 if(Math.random()<clamp(.1+p.a*.03+(p.level-e.level)*.065,.08,.50)){note('Ты увернулся от удара.','good');return}
 hurt(rng(1,e.attack));
 if(game.fight && Math.random()<(e.boss?.06:.035)){
  const part=Math.random()<.5?'leg':'jaw';
  if(!game.injuries[part]){game.injuries[part]=true;note(part==='leg'?'Травма ноги! Убежать теперь сложно.':'Травма челюсти! Еду и пиво пока не употребить.','combat')}
 }
}
function winFight(){
 const p=game.player,e=game.fight;
 if(!e)return;
 const prize=e.boss?55:rng(3,13)+game.region*4;
 const experience=e.boss?50:10+e.level*4;
 game.fight=null;p.money+=prize;p.rep+=e.boss?8:2;p.wins++;
 game.winCounts[game.region]++;
 note('Победа! +'+prize+' ₽, +'+experience+' опыта, +'+(e.boss?8:2)+' авторитета.','loot');
 addExp(experience);
 if(!e.boss){
  const before=p.hp;
  heal(p,Math.max(5,Math.ceil(maxHp(p)*.27)));

function attack(){
 if(!game.fight)return;
 const p=game.player,e=game.fight;
 const hits=chance(p,e.level)>90&&Math.random()<.30?2:1;
 for(let h=0;h<hits&&game.fight;h++){
  if(rng(1,100)>chance(p,e.level)){note('Ты промахнулся.','combat');break}
  const damage=Math.max(1,rng(Math.max(1,Math.floor(p.s/2)),Math.max(2,p.s+2))+Math.max(0,p.level-e.level)+p.weapon+p.shoes-e.def);
  e.hp-=damage;note('Ты нанёс '+damage+' урона'+(h===1?' вторым ударом.':'.'),'good');
  if(e.hp<=0){winFight();break}
 }
 if(game.fight)enemyTurn();

function flee(){

 if(lowHealth||e.escapeAttempts>=3||rng(1,100)<=chanceToEscape){
  const penalty=e.boss?3:1;
  game.fight=null;p.rep=Math.max(0,p.rep-penalty);
  if(e.boss)note('Отступил от финального противника. Потерял '+penalty+' авторитета. Можно подготовиться и вернуться.','combat');

 }else{
  note('Попытка убежать не удалась ('+e.escapeAttempts+'/3). '+(game.injuries.leg?'Нога мешает, но отступление всё равно возможно.':'Пробуй ещё.'),'combat');
  enemyTurn();
 }
 saveRender();
}

  } else {const money=rng(3,9)+p.l;p.money+=money;note('На дороге нашлось '+money+' ₽.','loot')}

  airgun:()=>{p.airgun=true;note('Купил пневматику. Пули продаются отдельно.','good')},
  pellets:()=>{p.ammo+=6;note('Пульки: +6 штук. Всего '+p.ammo+'.','loot')},
  bandage:()=>{p.bandage++;note('Купил повязку: +1.','loot')},
  phone:()=>{p.phone=true;note('Теперь можешь связаться с пацанами при опасности.','good')},
  heal:()=>{p.hp=maxHp(p);game.injuries={leg:false,jaw:false};note('В медпункте залечили травмы и восстановили здоровье.','good')},
  force:()=>{p.s++;p.hp++;note('Качалка: сила +1.','good')},

 };
 if(opts[kind])opts[kind]();
 saveRender();

   actions+=button(`🌭 Еда · ${PRICE.hotdog} ₽`,'buy:hotdog')+button(`🍺 Пиво · ${PRICE.beer} ₽`,'buy:beer')+button(`👟 Бутсы · ${PRICE.shoes} ₽`,'buy:shoes')+button(`🧥 Кожанка · ${PRICE.shirt} ₽`,'buy:shirt')+button(`✊ Кастет · ${PRICE.knuckle} ₽`,'buy:knuckle');
   actions+=button('🩹 Повязка · '+PRICE.bandage+' ₽','buy:bandage')+button('🥾 Крепкие ботинки · '+PRICE.boots+' ₽','buy:boots');
   actions+=button('🎩 ПОПЫТАТЬ УДАЧУ','steal','wide',game.wanted>=3);
   actions+=button('🧳 К БАРЫГАМ','view:trader','wide',!game.unlocked.trader);
 }else if(v==='trader'){
   title='БАРЫГИ';body=game.unlocked.trader?'Здесь скупают найденный хлам и предлагают редкие вещи.':'Ты пока не знаешь, где их искать.';
   if(game.unlocked.trader){
     actions+=button(`💰 Продать хлам (${p.junk||0} шт.)`,'sell','wide',!(p.junk||0));
     actions+=button(`🔪 Оружие +6 · ${PRICE.knife} ₽`,'buy:knife');
     actions+=button(`📱 Телефон · ${PRICE.phone} ₽`,'buy:phone');
     actions+=button('🦺 Жилет (защита +4) · '+PRICE.vest+' ₽','buy:vest');
     actions+=button('🔫 Пневматика · '+PRICE.airgun+' ₽','buy:airgun');
     actions+=button('📦 6 пулек · '+PRICE.pellets+' ₽','buy:pellets','',!p.airgun);
   }
   actions+=button('↩️ К БАЗАРУ','view:market','wide');
 }else if(v==='gym'){
   title='КАЧАЛКА';body=game.unlocked.gym?'Качалка помогает улучшать характеристики за деньги.':'Пока не знаешь, где находится качалка. Поищи по району или поговори с местными.';
   if(game.unlocked.gym){
    actions+=button(`💪 Сила +1 · ${PRICE.force} ₽`,'buy:force')+button(`❤️ Живучесть +1 · ${PRICE.vital} ₽`,'buy:vital');
    actions+=button(`⚡ Ловкость +1 · ${PRICE.agility} ₽`,'buy:agility')+button(`🍀 Удача +1 · ${PRICE.luck} ₽`,'buy:luck');
    actions+=button(`🛡️ Защита +1 · ${PRICE.armor} ₽`,'buy:armor','wide');
   }
 }else if(v==='hangout'){
   title='ПРИТОН И ЗНАКОМСТВА';body='Во дворе собираются местные. Заводи знакомства, узнавай полезные адреса и укрепляй репутацию.';
   if(game.unlocked.hangout){
     body+='<div class="chapter-place">📋 Братва · '+esc(missionInfo())+'</div>';
     body+='<div class="yellow">Выполнено поручений: '+game.completedMissions+'. Доверие: '+game.crew+'/10.</div>';
   }
   actions+=button('🤝 УЗНАТЬ НОВОСТИ','discuss','wide');
   actions+=button('🍺 УГОСТИТЬ ПАЦАНОВ','pub','wide',!game.unlocked.hangout);
   if(game.unlocked.hangout){
     actions+=game.crewMission?button('📦 СДАТЬ ПОРУЧЕНИЕ','claim','wide',missionProgress(game.crewMission)<MISSIONS.find(x=>x.id===game.crewMission.id).goal):button('📋 ВЗЯТЬ ПОРУЧЕНИЕ','mission','wide');
   }
   actions+=button('🎲 В КЛУБ','view:club','',!game.unlocked.club);
   actions+=button(game.girlfriend?'💛 К ПОДРУГЕ':'💬 К ЗНАКОМОЙ','view:girl','',!game.romance.met&&!game.girlfriend);
   actions+=button('🩺 В МЕДПУНКТ','view:clinic','wide');
 }else if(v==='club'){
   title='КЛУБ';body=game.unlocked.club?'Музыка, карты, танцы и разговоры. Можно рискнуть небольшой ставкой и потренировать удачу.':'Ты пока не нашёл местный клуб.';
   if(game.unlocked.club)actions+=button('🃏 СЫГРАТЬ В КАРТЫ · 5 ₽','cards','wide');
   actions+=button('↩️ ВО ДВОР','view:hangout','wide');
 }else if(v==='girl'){
   title=game.girlfriend?'ПОДРУГА':'ЗНАКОМСТВО';
   if(game.girlfriend){
     body='Вы уже встречаетесь. Здесь можно отдохнуть от разборок и восстановиться.';
     actions+=button('💛 ПРОВЕСТИ ВЕЧЕР','girl','wide');
   }else if(game.romance.met){
     const needed={frost:3,gop:2,thief:4,pac:1}[game.classId]||3;
     body='Она согласна иногда поговорить. Но до отношений ещё далеко. Доверие: '+game.romance.trust+'/'+needed+'. Каждая встреча стоит 4 ₽, успех зависит от характера, удачи и авторитета.';
     actions+=button('💬 ПРИГЛАСИТЬ НА ВСТРЕЧУ · 4 ₽','court','wide',p.money<4);
   }else body='Пока ни с кем не познакомился. Попробуй гулять по району.';
   actions+=button('↩️ ВО ДВОР','view:hangout','wide');
 }else if(v==='clinic'){
   title='МЕДПУНКТ';body=`Здоровье: ${p.hp}/${maxHp(p)}. ${game.injuries.leg?'Травмирована нога. ':''}${game.injuries.jaw?'Травмирована челюсть. ':''}Медик может вылечить раны и травмы.`;
   actions+=button(`🩺 ЛЕЧИТЬСЯ · ${PRICE.heal} ₽`,'treat','primary wide');
   actions+=button('↩️ ВО ДВОР','view:hangout','wide');
 }else if(v==='hero'){
   const klass=CLASSES.find(c=>c.id===game.classId).name;
   if(heroPanel===0){
     title='ТВОЙ ГЕРОЙ · НАВЫКИ';
     body=`<div class="score"><div>Сила: <span>${p.s}</span></div><div>Ловкость: <span>${p.a}</span></div><div>Живучесть: <span>${p.v}</span></div><div>Удача: <span>${p.l}</span></div><div>Уровень: <span>${p.level}</span></div><div>Опыт: <span>${p.exp}/${needXp(p)}</span></div><div>Победы: <span>${p.wins}</span></div><div>Репутация: <span>${p.rep}</span></div></div>`;
     actions+=button('🎒 СНАРЯЖЕНИЕ','hero:equip')+button('🤝 СВЯЗИ','hero:social');
     if(p.points){actions+=button('Сила +1','up:s')+button('Ловкость +1','up:a')+button('Живучесть +1','up:v')+button('Удача +1','up:l')}
   }else if(heroPanel===1){
     title='ГЕРОЙ · СНАРЯЖЕНИЕ';
     body=`<div class="score"><div>Броня: <span>${p.armor}</span></div><div>Оружие: <span>+${p.weapon+p.shoes}</span></div><div>Пневматика: <span>${p.airgun?'есть':'нет'}</span></div><div>Пули: <span>${p.ammo}</span></div><div>Повязки: <span>${p.bandage}</span></div><div>Медальон: <span>${p.charm?'есть':'нет'}</span></div><div>Еда: <span>${p.hotdog}</span></div><div>Пиво: <span>${p.beer}</span></div></div>`;
     actions+=button('👤 НАВЫКИ','hero:skills')+button('🤝 СВЯЗИ','hero:social');
     actions+=button(`🍺 Пиво (${p.beer})`,'use:beer','',p.beer<1)+button(`🌭 Поесть (${p.hotdog})`,'use:hotdog','',p.hotdog<1);
     actions+=button(`🩹 Повязка (${p.bandage})`,'use:bandage','wide',p.bandage<1);
   }else{
     title='ГЕРОЙ · СВЯЗИ';
     body=`<div class="score"><div>Братва: <span>${game.crew}</span></div><div>Розыск: <span>${game.wanted}/3</span></div><div>Подруга: <span>${game.girlfriend?'есть':'нет'}</span></div><div>Знакомство: <span>${game.romance.met?'есть':'нет'}</span></div><div>Поручения: <span>${game.completedMissions}</span></div><div>Хлам: <span>${p.junk||0}</span></div><div>Телефон: <span>${p.phone?'есть':'нет'}</span></div><div>Район: <span>${game.region+1}</span></div></div>`;
     actions+=button('👤 НАВЫКИ','hero:skills')+button('🎒 СНАРЯЖЕНИЕ','hero:equip');
   }
   if(game.injuries.leg||game.injuries.jaw)body+='<div class="red">🩹 Есть травмы — нужен медпункт.</div>';
   actions+=button('💾 СОХРАНИТЬ','save')+button('↻ НОВАЯ ИГРА','reset','warn');
 }
 const labels={street:'КАЗАНЬ · 1998',market:'БАЗАР',gym:'КАЧАЛКА',hangout:'МЕСТНЫЕ ДЕЛА',hero:'ПЕРСОНАЖ',trader:'БАРЫГИ',club:'КЛУБ',girl:'ПОДРУГА',clinic:'МЕДИК'};
 const headline=v==='street'?(game.fight?'РАЗБОРКА':REGION[game.region]):({market:'Базар',gym:'Качалка',hangout:'Двор',hero:'Твой герой',trader:'Барыги',club:'Клуб',girl:'Подруга',clinic:'Медпункт'})[v];
 const art=v==='street'?'street':({trader:'market',club:'hangout',girl:'hangout',clinic:'hangout'})[v]||v;
 const fightBadge=game.fight&&v==='street'?'<div class="battle-badge">⚔️ БОЙ НАЧАЛСЯ</div>':'';
 return `<section class="panel scene-panel"><div class="scene-visual art-${art}"><span class="scene-number">${game.region===4?'ФИНАЛ':'РАЙОН '+(game.region+1)}</span><div class="scene-info"><span class="scene-kicker">${labels[v]}</span><div class="scene-headline">${esc(headline)}</div>${fightBadge}</div></div><div class="panel-body ${game.fight?'battle-body':''}"><div class="scene-title">${title}</div><div class="story">${body}</div></div><section class="scene-events" aria-label="История событий"><div class="scene-events-heading"><span>📜 СОБЫТИЯ · ${game.log.length}</span><button class="history-open" data-action="history">Вся история</button></div><div class="scene-events-list" role="log" aria-live="polite">${game.log.slice(-(window.innerHeight<=620?2:window.innerHeight<=700?3:window.innerHeight<=860?5:7)).map(l=>`<div class="log-line ${esc(l.type)}">${esc(l.text)}</div>`).join('')}</div></section><div class="action-grid">${actions}</div></section>`;
}
let actionPage=0,actionContext='',historyOpen=false;
function renderGame(){
 const labels=[['street','🚶','Улица'],['market','🛒','Базар'],['gym','💪','Качалка'],['hangout','🏠','Двор'],['hero','👤','Герой']];
 const context=[game.screen,game.view,game.region,!!game.fight,!!game.storyDone?.[game.region],!!game.crewMission,game.bossPhase].join(':');
 if(context!==actionContext){actionPage=0;actionContext=context}
 const logs=game.log.map(l=>`<div class="log-line ${esc(l.type)}">${esc(l.text)}</div>`).join('');
 app.innerHTML=`${renderHeader()}<main class="game-main">${contentForView()}</main><nav class="tabs" aria-label="Разделы игры">${labels.map(([id,ico,label])=>`<button class="tab ${game.view===id?'active':''}" data-view="${id}" ${game.fight&&id!=='street'?'disabled':''}><span class="tab-ico">${ico}</span>${label}</button>`).join('')}</nav>${historyOpen?`<div class="log-overlay" role="dialog" aria-modal="true" aria-label="Полная история событий"><div class="log-dialog"><div class="log-header">ВСЯ ИСТОРИЯ · ${game.log.length}<button class="smallbtn" data-action="history">Закрыть ✕</button></div><div class="log" role="log">${logs}</div></div></div>`:''}`;
 paginateActions();
 const journal=app.querySelector('.scene-events-list');
 if(journal)journal.scrollTop=journal.scrollHeight;
}
function paginateActions(){
 const grid=app.querySelector('.scene-panel>.action-grid');
 if(!grid)return;
 const buttons=Array.from(grid.querySelectorAll('button.action'));
 const perPage=window.innerHeight<=700?2:4;
 const count=Math.max(1,Math.ceil(buttons.length/perPage));
 actionPage=Math.min(actionPage,count-1);
 buttons.forEach((button,i)=>{button.hidden=i<actionPage*perPage||i>=(actionPage+1)*perPage});
 if(count>1){
  const nav=document.createElement('div');
  nav.className='action-pager';
  nav.innerHTML=`<button data-action="actions-prev" ${actionPage===0?'disabled':''} aria-label="Предыдущие действия">◀ Назад</button><span>Действия ${actionPage+1}/${count}</span><button data-action="actions-next" ${actionPage===count-1?'disabled':''} aria-label="Следующие действия">Далее ▶</button>`;
  grid.appendChild(nav);
 }
}
function renderEnd(){let won=game.screen==='won';app.innerHTML=`${renderHeader()}<main class="panel"><div class="scene-visual art-street"><div class="scene-info"><span class="scene-kicker">${won?'ГЛАВА ПРОЙДЕНА':'УЛИЧНАЯ ИСТОРИЯ'}</span><div class="scene-headline">${won?'ТЫ НА ВЕРШИНЕ':'КОНЕЦ ИГРЫ'}</div></div></div><div class="panel-body"><div class="intro-logo" style="font-size:32px">${won?'ПОБЕДА!':'ТЫ СДОХ'}</div><p class="story" style="text-align:center">${won?(game.ending==='peace'?'Ты прошёл свой путь. Казань помнит разные способы завоевать уважение.':'Ты прошёл четыре района, победил в финальной схватке и доказал, что сумел подняться с самого низа.'):'Твоё путешествие по Казани закончилось слишком рано. Но историю можно начать заново.'}</p><p class="story yellow" style="text-align:center">Побед: ${game.player.wins} · Уровень: ${game.player.level}</p><div class="action-grid">${button('↻ НАЧАТЬ ЗАНОВО','reset','primary wide')}</div></div></main>`}
function render(){if(game.screen==='select')renderStart();else if(game.screen==='game')renderGame();else renderEnd()}
app.addEventListener('click',ev=>{const el=ev.target.closest('button');if(!el||el.disabled)return;
 if(el.dataset.class){game.classId=el.dataset.class;game.name=$('#nick')?.value||game.name;saveRender();return}
 if(el.dataset.view){historyOpen=false;if(el.dataset.view==='hero')heroPanel=0;setView(el.dataset.view);return}
 const action=el.dataset.action;if(!action)return;
 if(action==='history'){historyOpen=!historyOpen;render();return}
 if(action.startsWith('hero:')){heroPanel=({skills:0,equip:1,social:2})[action.slice(5)]??0;actionPage=0;render();return}
 if(action==='actions-prev'){actionPage=Math.max(0,actionPage-1);render();return}
 if(action==='actions-next'){actionPage++;render();return}
 switch(action){case 'new':newGame();return;case 'wander':wander();return;case 'mission':acceptMission();return;case 'claim':claimMission();return;case 'fire':fireAirgun();return;case 'bandage':combatBandage();return;case 'attack':attack();return;case 'flee':flee();return;case 'travel':travel();return;case 'discuss':discuss();return;case 'pub':pub();return;case 'treat':treat();return;case 'steal':steal();return;case 'sell':sellJunk();return;case 'cards':cards();return;case 'girl':visitGirl();return;case 'court':court();return;case 'save':note('Прогресс сохранён в браузере.','good');saveRender();return;case 'reset':if(confirm('Начать новую игру? Текущий прогресс будет удалён.')){game=initial();saveRender()}return;default:if(action.startsWith('story:'))chooseStory(Number(action.slice(6)));else if(action.startsWith('buy:'))buy(action.slice(4));else if(action.startsWith('use:'))use(action.slice(4));else if(action.startsWith('up:'))upgrade(action.slice(3));else if(action.startsWith('view:'))setView(action.slice(5));}
});
window.addEventListener('pagehide',safeWrite);render();
})();
</script>
</body></html>
