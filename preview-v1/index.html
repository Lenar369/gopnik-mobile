function getRumor(src){if(!g.flags.rumor){g.flags.rumor=true;exp(14)}log(src+' Теперь ясно: Дамир пропал после странной разгрузки возле дома №12.');}
function getNote(src){if(!g.evidence.note){g.evidence.note=true;exp(17)}log(src+' «Если спросят — не видел. Не верь тому, кто предложит помощь первым».');}
function getReceipt(src){if(!g.evidence.receipt){g.evidence.receipt=true;exp(19)}log(src+' На бумаге «Северный двор», подпись и дата. Суммы не сходятся.');}
function completed(){return !!(g.flags.rumor&&g.evidence.note&&g.evidence.receipt)}
function changePlace(id,mins){advance(mins||12);g.loc=id;g.area=AREAS.some(function(x){return x.id===id})?id:'q5';g.scene=null;screen='scene';log('Ты направился в «'+locName()+'».');save();render()}
function itemName(id){return GOODS[id]?GOODS[id].name:id}
function efx(){var s=stats();return 'Сила '+s.s+' · Ловкость '+s.a+' · Смекалка '+s.i+' · Авторитет '+s.r}
function btn(text,id,sub,cls,disabled){return '<button class="act '+(cls||'')+'" data-act="'+esc(id)+'"'+(disabled?' disabled':'')+'><b>'+esc(text)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</button>'}
function wrapActions(a){return '<div class="buttons">'+a.map(function(t){return btn(t[0],t[1],t[2],t[3],t[4])}).join('')+'</div>'}
function panel(title,desc,buttons){return '<div class="panel"><div class="pad"><div class="caps">'+esc(title)+'</div><p class="story">'+esc(desc)+'</p></div>'+wrapActions(buttons)+'</div>'}
function pfx(){return g.origin==='ordinary'?'Ты вырос в этих дворах и знаешь многих соседей.':g.origin==='gop'?'В компании тебя узнают с первого взгляда.':g.origin==='thief'?'Ты замечаешь мелкие детали, которые другие пропускают.':'Люди стараются понять, чего от тебя ждать.'}

function stageText(){
if(g.chapterFinished)return 'Глава 1 завершена. Твоя история продолжится в следующих версиях. Можно исследовать текущие места.';
var k=Number(!!g.flags.rumor)+Number(!!g.evidence.note)+Number(!!g.evidence.receipt);
return k===0?'Начало расследования · 0/3 зацепок':k===3?'Три зацепки собраны · можно завершать главу':'Расследование · '+k+'/3 зацепок';
}

function winConflict(via){
g.combat=null;g.flags.disputeDone=true;g.relations.gena+=via==='talk'?1:via==='fight'?-1:0;exp(25);
log(via==='fight'?'Конфликт разрешился победой. Весь двор теперь обсуждает потасовку.':via==='talk'?'Удалось договориться без драки. Парни признали твою правоту.':'Ты избежал драки, но сохранил своё достоинство.');screen='scene';save();render();
}
function enemyTurn(mode){
if(!g.combat)return;
var c=g.combat,st=stats(),hit=Math.random()<.78;
var dmg=c.intent==='heavy'?rnd(12,20):c.intent==='quick'?rnd(7,11):rnd(5,9);
if(mode==='block')dmg=Math.ceil(dmg*(c.intent==='heavy'?.7:.45));
var dodged=false;if(mode==='dodge'&&hit&&Math.random()<clamp((40+6*(st.a-3))/100,.15,.7)){hit=false;dodged=true;}
if(hit){g.hp=Math.max(0,g.hp-dmg);log('Противник ударил: −'+dmg+' HP.'+(mode==='block'?' Часть урона заблокирована.':''))}
else log('Атака противника не достигла цели.');
g.stamina=clamp(g.stamina+6+(mode==='block'?14:0),0,100);
c.counterReady=(mode==='block'&&hit||mode==='dodge'&&dodged)&&g.skills.includes('counter');
c.turn++;c.intent=['quick','heavy','feint'][c.turn%3];
if(g.hp<=0){g.combat=null;g.hp=30;g.stamina=35;g.flags.injured=true;advance(180);g.area='q5';g.loc='home';log('Ты очнулся дома с 30 HP и временной травмой. Задания и предметы не потеряны.');}
}
function hit(kind){
var c=g.combat,p=stats();if(!c)return;
var conf={quick:[8,.90,6,10],normal:[12,.70,10,14],heavy:[24,.50,16,23]}[kind];
if(g.stamina<conf[0]){log('Недостаточно выносливости. Используй блок, чтобы восстановиться.');save();render();return}
g.stamina-=conf[0];c.counterReady=false;
var pct=clamp(conf[1]+(p.a-3)*.02+accuracyPenalty()/100,.15,.98);
if(Math.random()<pct){var dmg=rnd(conf[2],conf[3])+Math.max(0,p.s-2);c.hp=Math.max(0,c.hp-dmg);log('Попадание! Противнику нанесено '+dmg+' урона.');}
else log('Удар прошёл мимо.');
if(c.hp<=0){winConflict('fight');return}
enemyTurn('none');save();render();
}
