case 'dialog-zoya':if(!g.quests.bag)add('Помочь найти сумку','acceptbag');else if(g.quests.bag===2){add('Вернуть сумку','returnbag','Доверие и 35 ₽');}else add('Спросить про грузовик','rumor');add('Расспросить о Дамире','rumor');break;

case 'dialog-sanya':add('Поверить Саньку','trustsanya');add('Расспросить жёстко','presssanya');break;
case 'dialog-valera':if(g.quests.light===0)add('Взять поручение','acceptlight');else if(g.quests.light===1)add('Помочь в подвале','repair');else if(g.quests.light===2)add('Получить награду','paylight','50 ₽');else add('Поговорить о Дамире','rumor');break;

function infoFor(id){if(id==='fight')return 'Противник '+g.fight.hp+'/65 HP. Ты можешь защищаться, договориться или убежать.';
if(id==='finish')return 'Собраны три зацепки: слух, записка и копия накладной. Кому ты доверишь находки?';
if(id==='dialog-zoya')return g.quests.bag===2?'«Это моя сумка! Где ты её нашёл?»':g.quests.bag===1?'«Посмотри у спортплощадки, пожалуйста»':'«Сумка пропала, а я видела подозрительный грузовик у дома №12»';
if(id==='dialog-valera')return g.quests.light===2?'«Свет теперь работает. Держи обещанную награду».':'«В подъезде щиток барахлит. Поможешь — отблагодарю». Подвал откроется после согласия.';
if(id==='dialog-g')return '«Слышь, чего по чужому двору ходишь? С людьми по-человечески разговаривать надо».';
if(id==='dialog-sanya')return '«Дамира два дня не видел. Кто-то ищет его бумаги. Мне это не нравится».';
if(id==='dialog-fight')return 'Парни спорят из-за площадки. Один толкает тебя плечом. Выбери, как реагировать.';
if(id==='districts')return 'Семь районов открыты. Остальные районы пока ознакомительные, без больших сюжетных глав.';
if(id==='shop')return 'Выбирай предмет. Покупки и экипировка сохраняются.';
const p=places.find(x=>x.id===id);return p?p.text:(id==='basement'?'В подвале темно, трубы гудят. Здесь может быть нужная бумага.':'Казань, осень 1998 года.')}
function drawDrawer(){if(!focus)return '';let a=actionsFor(focus),n=Math.max(1,Math.ceil(a.length/4));page=Math.min(page,n-1);let visible=a.slice(page*4,page*4+4);return '<aside class="drawer"><div class="drawer-head"><strong>'+esc(places.find(p=>p.id===focus)?.name||({'fight':'Разборка','finish':'Конец первой главы','districts':'Выбор района','shop':'Киоск Бориса','dialog-zoya':'Тётя Зоя','dialog-g':'Гена Рыжий','dialog-sanya':'Санёк','dialog-valera':'Слесарь Валера','dialog-fight':'Конфликт','closet':'Домашний шкаф','basement':'Подвал'}[focus]||focus))+'</strong><button class="drawer-close" data-do="close" aria-label="Закрыть">×</button></div><div class="description">'+esc(infoFor(focus))+'</div><div class="actionsbar">'+visible.map(b=>'<button class="act '+(b.alt?'alt':'')+'" data-do="'+esc(b.doit)+'">'+esc(b.name)+(b.sub?'<small>'+esc(b.sub)+'</small>':'')+'</button>').join('')+'</div>'+(n>1?'<div class="pager"><button data-do="pageprev" '+(!page?'disabled':'')+'>‹</button> '+(page+1)+' / '+n+' <button data-do="pagenext" '+(page>=n-1?'disabled':'')+'>›</button></div>':'')+'</aside>'}
function viewPanel(){let h='';if(view==='bag'){h='<div class="avatar"><div class="face">🎒</div><div><strong>Рюкзак '+g.inventory.length+'/20</strong><div>Предметы и пять слотов экипировки</div></div></div><div class="tilegrid">'+g.inventory.map((x,i)=>'<button class="tile" data-do="item:'+i+'"><b>'+esc(goods[x]?.name||x)+'</b><small>'+esc(goods[x]?.stat||'')+'</small></button>').join('')+'</div><div class="line"><strong>Надето:</strong> '+Object.entries(g.equip).map(([k,v])=>esc(k)+': '+(v?esc(goods[v].name):'—')).join(' · ')+'</div>'}

else if(view==='log')h=g.log.map(t=>'<div class="line">'+esc(t)+'</div>').join('');
return '<section class="overlay"><header class="panel-head"><h2>'+({bag:'Инвентарь',hero:'Персонаж',quests:'Задания',log:'Журнал событий'}[view]||'')+'</h2><button data-nav="map">×</button></header><div class="panel-body">'+h+'</div></section>'}

function setupMap(){let v=document.getElementById('maphost');if(!v)return;viewportW=v.clientWidth;viewportH=v.clientHeight;if(!zoom||zoom<0.1){zoom=viewportH/738}if(!root.dataset.initializedMap){zoom=viewportH/738;px=Math.max(viewportW-1032*zoom,Math.min(0,viewportW*.46-354*zoom));py=0;root.dataset.initializedMap='1';}
const startDrag=e=>{if(e.target.closest('.zoom'))return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,px,py,moved:false};v.setPointerCapture(e.pointerId);v.classList.add('dragging')};
v.onpointerdown=startDrag;
v.onpointermove=e=>{if(!drag||e.pointerId!==drag.id)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;px=drag.px+dx;py=drag.py+dy;applyMap()};
v.onpointerup=e=>{if(!drag)return;const wasMoved=drag.moved;v.classList.remove('dragging');drag=null;if(wasMoved){v.dataset.justDragged='1';setTimeout(()=>{v.dataset.justDragged=''},150)}};
v.onpointercancel=()=>{drag=null;v.classList.remove('dragging')};}
function applyMap(){let v=document.getElementById('maphost'),w=document.getElementById('world');if(!v||!w)return;let ww=1032*zoom,wh=738*zoom;px=ww>v.clientWidth?Math.min(0,Math.max(v.clientWidth-ww,px)):(v.clientWidth-ww)/2;py=wh>v.clientHeight?Math.min(0,Math.max(v.clientHeight-wh,py)):(v.clientHeight-wh)/2;w.style.transform='translate('+px+'px,'+py+'px) scale('+zoom+')'}
function announceAndRender(t){announce(t);render()}
function doAction(id){if(id==='close'){focus=null;page=0;render();return}if(id==='pageprev'){page=Math.max(0,page-1);render();return}if(id==='pagenext'){page++;render();return}if(id==='start'){start();return}if(id==='zoomplus'||id==='zoomminus'){zoom=Math.max(.55,Math.min(2.3,zoom*(id==='zoomplus'?1.25:.8)));applyMap();return}
if(id.startsWith('item:')){let n=+id.split(':')[1],item=g.inventory[n];if(!item)return;if(item==='bandage'){g.hp=Math.min(100,g.hp+20);g.inventory.splice(n,1);announce('Ты использовал бинт и восстановил 20 HP.')}else{let slot=goods[item].slot,old=g.equip[slot];g.equip[slot]=item;g.inventory.splice(n,1);if(old)g.inventory.push(old);announce('Надето: '+goods[item].name)}save();render();return}
if(id.startsWith('buy:')){let item=id.split(':')[1],it=goods[item];if(g.money<it.cost||g.inventory.length>=20){announceAndRender('Не хватает денег или места в рюкзаке.');return}g.money-=it.cost;g.inventory.push(item);advance(5);announceAndRender('Куплено: '+it.name+' за '+it.cost+' ₽.');return}
if(id.startsWith('region:')){g.region=+id.split(':')[1];focus=null;view='map';advance(30);announce('Направление: '+regions[g.region]+'. Подробная карта района появится позже; сейчас исследуем Пятый квартал.');render();return}
if(id.startsWith('ending:')){g.facts.end=true;advance(15);let route={'ending:people':'Ты решил помочь соседям и рабочим','ending:crew':'Ты поделился уликами со дворовой компанией','ending:alone':'Ты оставил документы у себя'}[id];focus=null;announceAndRender(route+'. Глава 1 закончена.');return}
if(id==='room'){advance(12);announceAndRender(origins[g.origin].desc);return}
if(id==='family'){advance(10);addFact('rumor','Домочадцы рассказали о чужом грузовике у дома №12.');render();return}
if(id==='mail'){advance(10);addFact('note','Найдена записка Дамира: «Не верь первому, кто предложит помощь».');render();return}
if(id==='rest'||id==='sleep'){let sleep=id==='sleep';advance(sleep?480:120);g.hp=Math.min(100,g.hp+(sleep?60:20));g.stamina=Math.min(100,g.stamina+(sleep?100:30));announceAndRender(sleep?'Ты поспал 8 часов: +60 HP и все силы.':'Ты отдохнул 2 часа: +20 HP.');return}
if(id==='closet'){focus='closet';page=0;render();return}
if(id==='closetstore'){let n=g.inventory.indexOf('bandage');if(n<0){announceAndRender('Бинта в рюкзаке нет.');return}g.inventory.splice(n,1);g.facts.closetBandage=true;announceAndRender('Бинт теперь в шкафу.');return}
if(id==='closettake'){if(!g.facts.closetBandage){announceAndRender('Шкаф пуст.');return}if(g.inventory.length>=20){announceAndRender('Рюкзак полон.');return}g.inventory.push('bandage');g.facts.closetBandage=false;announceAndRender('Бинт забран из шкафа.');return}
if(id==='rumor'||id==='bench'||id==='stairs'||id==='boris'||id==='nightlook'){advance(10);addFact('rumor','Соседи подтвердили: Дамира видели у грузовика компании «Северный двор».');render();return}
if(id==='receipt'||id==='market-talk'){advance(12);addFact('receipt','Найдена копия накладной №17: суммы и подписи не сходятся.');render();return}
if(id==='zoya'){focus='dialog-zoya';page=0;render();return}
if(id==='acceptbag'){g.quests.bag=1;g.relations.zoya++;advance(10);announceAndRender('Зоя попросила найти сумку возле спортплощадки.');focus='court';render();return}
if(id==='bagsearch'){advance(15);if(g.quests.bag===1){g.quests.bag=2;announceAndRender('Найдена сумка Зои. Её нужно вернуть хозяйке.')}else announceAndRender('Ты осмотрел территорию, но ничего важного не нашёл.');return}
if(id==='returnbag'){g.quests.bag=3;g.money+=35;g.relations.zoya+=2;advance(10);announceAndRender('Ты вернул сумку Зое и получил 35 ₽.');focus='court';render();return}
if(id==='sanya'){focus='dialog-sanya';page=0;render();return}
if(id==='trustsanya'||id==='presssanya'){g.relations.sanya+=id==='trustsanya'?2:-1;advance(10);addFact('rumor','Санёк признался, что видел Дамира у гаражей.');focus='court';render();return}
if(id==='gena'){focus='dialog-g';page=0;render();return}
if(id==='talkgena'||id==='hardgena'){g.relations.gena+=id==='talkgena'?1:-1;advance(10);announceAndRender(id==='talkgena'?'Вы разошлись миром.':'Гена запомнил твой резкий ответ.');focus='court';render();return}
if(id==='valera'){focus='dialog-valera';page=0;render();return}
if(id==='acceptlight'){g.quests.light=1;advance(10);focus='garage';announceAndRender('Валера разрешил спуститься в подвал и проверить щиток.');return}
if(id==='basement'){if(!g.quests.light){announceAndRender('Подвал закрыт. Сначала поговори со слесарем Валерой.');return}focus='basement';page=0;render();return}
if(id==='repair'){if(!g.quests.light){announceAndRender('Нет доступа к электрощитку.');return}advance(70);g.quests.light=2;focus='garage';announceAndRender('Свет восстановлен. Вернись к Валере за наградой.');return}
if(id==='paylight'){g.quests.light=3;g.money+=50;advance(10);focus='garage';announceAndRender('Валера заплатил 50 ₽.');return}
if(id==='work'){if(g.jobDay===g.day){announceAndRender('Сегодня ты уже работал здесь.');return}g.jobDay=g.day;advance(90);g.money+=45;announceAndRender('Ты разгрузил детали и заработал 45 ₽.');return}
if(id==='dispute'){focus='dialog-fight';page=0;render();return}
if(id==='fight'){g.fight={hp:65,intent:0,escape:0};focus='fight';page=0;announceAndRender('Началась драка. Уклоняйся, блокируй или попробуй договориться.');return}
if(id==='peace'){g.fight=null;focus='play';advance(10);announceAndRender('Уладил конфликт без драки.');return}
if(id==='escape'){g.fight.escape++;if(g.fight.escape>=3||Math.random()<.7){g.fight=null;focus='play';announceAndRender('Ты ушёл от конфликта.')}else{enemy('normal');render()}return}
if(id.startsWith('attack:')){const a=id.split(':')[1];const chances={fast:.9,normal:.7,heavy:.5},power={fast:[6,10],normal:[10,14],heavy:[16,24]},cost={fast:8,normal:12,heavy:24};if(g.stamina<cost[a]){announceAndRender('Недостаточно сил. Используй блок.');return}g.stamina-=cost[a];if(Math.random()<chances[a]){let p=power[a],damage=p[0]+Math.floor(Math.random()*(p[1]-p[0]+1));g.fight.hp=Math.max(0,g.fight.hp-damage);announce('Попадание: −'+damage+' HP противнику.')}else announce('Промах.');if(g.fight.hp===0){g.fight=null;focus='play';announceAndRender('Победа! Но здоровье не восстанавливается автоматически.');return}enemy('normal');render();return}
if(id==='block'||id==='dodge'){enemy(id);render();return}
if(id==='finish'){if(!hasClues()){announceAndRender('Сначала собери три сюжетные зацепки.');return}focus='finish';page=0;render();return}
if(id==='timetable'||id==='wander'||id==='backlook'||id==='garage-look'||id==='train'){advance(15);announceAndRender('Ты осмотрел это место и узнал пару местных историй.');return}
if(id==='nightlook'){advance(15);addFact('rumor','Ночью ты заметил свет фар возле дома №12.');render();return}
if(id==='districts'||id==='shop'){focus=id;page=0;render();return}
announceAndRender('Это действие будет расширено в следующей сборке.')}
function enemy(mode){let v=6+Math.floor(Math.random()*9),inten=g.fight?.intent??0;if(mode==='block')v=Math.ceil(v*(inten===2?.7:.45));if(mode==='dodge'&&Math.random()<.55)v=0;g.hp=Math.max(0,g.hp-v);g.stamina=Math.min(100,g.stamina+(mode==='block'?23:6));if(g.fight)g.fight.intent=(inten+1)%3;if(g.hp===0){g.hp=30;g.stamina=30;g.fight=null;focus='home';advance(180);announce('Ты очнулся дома с 30 HP. История продолжается, но у тебя временная травма.')}else announce(v?'Противник нанёс '+v+' урона.':'Ты избежал удара.')}
root.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav){view=nav.dataset.nav;focus=null;page=0;render();return}let origin=e.target.closest('[data-origin]');if(origin){selectedOrigin=origin.dataset.origin;let name=document.getElementById('nickname')?.value;render();let input=document.getElementById('nickname');if(input&&name)input.value=name;return}let pin=e.target.closest('[data-pin]');if(pin){if(document.getElementById('maphost')?.dataset.justDragged)return;focus=pin.dataset.pin;g.loc=focus;view='map';page=0;advance(10);save();render();return}let b=e.target.closest('[data-do]');if(b){doAction(b.dataset.do);return}});
window.addEventListener('resize',()=>{if(g&&view==='map'){let el=document.getElementById('maphost');if(el){viewportW=el.clientWidth;viewportH=el.clientHeight;applyMap()}}});
render();
})();</script></body></html>
